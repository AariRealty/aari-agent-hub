<title>Aari Hub Dashboard</title>
<style>
  :root{
    --g1:#fcfcfa; --g2:#faf5eb; --ink:#1a1a1a; --soft:#6a6a6a; --mute:#8a8378;
    --fill:#000; --taupe:#c9bfa8; --panel:#141210; --card:#fff; --warm:#faf5eb;
    --line:#ece9e2; --wash:#f0ede6; --ok:#1a6b3c; --bad:#B04040; --r:20px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(135deg,var(--g1) 0%,var(--g1) 42%,#fdfaf2 68%,var(--g2) 100%);
    min-height:100vh;font-family:"Helvetica Neue",Helvetica,Arial,ui-sans-serif,system-ui,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;padding:16px;font-variant-numeric:tabular-nums}
  .shell{max-width:1480px;margin:0 auto}

  /* ---------- entrance motion ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .anim{opacity:0;animation:rise .62s var(--ease) forwards}
  .bar-el,.nav,.strip{opacity:0;animation:fade .5s var(--ease) forwards}
  .bar-el{animation-delay:.02s} .strip{animation-delay:.14s}

  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 20px;font-size:14.5px;font-weight:500}
  .nav{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;flex:1;min-width:0;overflow-x:auto}
  .nav a{padding:8px 14px;border-radius:999px;font-size:13px;color:var(--mute);text-decoration:none;white-space:nowrap;transition:color .2s}
  .nav a:hover{color:var(--ink)} .nav a.on{background:var(--panel);color:#fff}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--panel);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;overflow:hidden}
  h1{font-size:clamp(30px,3.8vw,46px);font-weight:500;letter-spacing:-1.7px;line-height:1.03;margin-bottom:14px;opacity:0;animation:rise .7s var(--ease) .05s forwards}
  .strip{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .metric .k{font-size:11.5px;color:var(--soft);margin-bottom:5px}
  .pill{border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:500}
  .pill.dark{background:var(--panel);color:#fff}
  .pill.alert{background:#f7ecea;border:1px solid #e8cfcb;color:var(--bad);font-weight:600}
  .track{flex:1;min-width:150px;height:40px;border-radius:999px;border:1px solid var(--line);position:relative;overflow:hidden;
    background:repeating-linear-gradient(115deg,var(--wash) 0 7px,transparent 7px 14px);
    display:flex;align-items:center;padding:0 18px;font-size:13px;color:var(--soft)}
  .track i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(201,191,168,.34);transition:width 1.5s var(--ease) .5s}
  .track span{position:relative}
  .bignums{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
  /* the pipeline pills and the month track describe the dashboard; on a tab
     page they are stale furniture, so they come off and the headline
     numbers slide left */
  .strip.tabbed .dashonly{display:none}
  .bignum .v{font-size:clamp(26px,2.8vw,38px);font-weight:500;letter-spacing:-1.4px;line-height:1}
  .bignum .l{font-size:11.5px;color:var(--soft);margin-top:2px}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;min-width:0}
  .card.warm{background:var(--warm)} .card.dark{background:var(--panel);color:#fff;border-color:#2a2a22}
  .card.flush{padding:0;overflow:hidden}
  .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
  .ct{font-size:17.5px;font-weight:500;letter-spacing:-.4px}
  .arrow{width:31px;height:31px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;flex-shrink:0;transition:transform .2s var(--ease),background .2s}
  .arrow:hover{transform:translate(2px,-2px)}
  .card.dark .arrow{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}
  .lab{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);font-weight:600}
  .fill{flex:1} .note{font-size:11px;color:var(--mute);margin-top:9px;line-height:1.45}
  button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .photo{position:relative;min-height:312px;background:var(--panel);display:flex;flex-direction:column;justify-content:flex-end}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photo .mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#2f2a24,#141210);color:var(--taupe);font-size:60px;font-weight:600;letter-spacing:2px}
  .photo .scrim{position:relative;padding:18px;background:linear-gradient(to top,rgba(10,9,8,.9),rgba(10,9,8,0));color:#fff}
  .photo .pn{font-size:17px;font-weight:500} .photo .pr{font-size:12.5px;color:rgba(255,255,255,.68);margin-top:2px}
  .photo .pchip{position:absolute;right:18px;bottom:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:7px 13px;font-size:12.5px;color:#fff;white-space:nowrap;backdrop-filter:blur(4px)}
  .photo .ptag{position:absolute;top:16px;left:18px;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:600}

  .bars{display:flex;align-items:flex-end;gap:9px;flex:1;min-height:104px;margin-top:10px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .bfill{width:13px;border-radius:99px;background:var(--taupe);height:0;transition:height .85s var(--ease)}
  .bfill.on{background:var(--fill)}
  .bl{font-size:11px;color:var(--mute)}

  .rwrap{position:relative;width:178px;height:178px;margin:6px auto 0}
  .rtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .rtext .v{font-size:29px;font-weight:500;letter-spacing:-.9px}
  .rtext .l{font-size:11.5px;color:var(--soft);margin-top:3px}
  .rfoot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--soft);margin-top:12px}
  .rfoot b{color:var(--ok);font-weight:600}
  .ring{transition:stroke-dashoffset 1.6s var(--ease) .35s}

  .segs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 2px}
  .seg{border-radius:12px;padding:11px 8px;text-align:center;font-size:12px;font-weight:500}
  .seg.a{background:var(--fill);color:#fff} .seg.b{background:var(--taupe)} .seg.c{background:var(--wash);color:var(--mute)}
  .segl{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;font-size:11.5px;color:var(--soft)}

  .rows{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0} .card.dark .row{border-color:rgba(255,255,255,.09)}
  .rname{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .rmeta{font-size:11.5px;color:var(--mute);margin-top:1px}
  .card.dark .rmeta{color:rgba(255,255,255,.5)}
  .rbar{height:7px;border-radius:99px;background:var(--wash);flex:1.2;min-width:44px;overflow:hidden}
  .rbar i{display:block;height:100%;width:0;background:var(--fill);border-radius:99px;transition:width 1s var(--ease) .5s}
  .rnum{font-size:13px;font-weight:600;width:22px;text-align:right}
  .chip{border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;white-space:nowrap}
  .chip.red{background:#f7ecea;color:var(--bad)} .chip.dk{background:var(--panel);color:#fff}
  .chip.gh{background:var(--wash);color:var(--soft)}
  .tick{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.28);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
  .tick.done{background:#fff;border-color:#fff;color:var(--ink)}
  .strike{text-decoration:line-through;opacity:.5}
  .lanetag{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--taupe);font-weight:600;margin:12px 0 0}

  /* ---------- announcement deck: cards shuffling one behind the other ---------- */
  .deck{position:relative;flex:1;min-height:196px;margin-top:2px}
  /* top AND bottom pinned so each card fills the well; content-height cards
     left a dead gap under the stack when the card grew with the row */
  .dc{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;
    border-radius:16px;padding:16px 17px;background:var(--panel);color:#fff;
    border:1px solid #2c2a24;box-shadow:0 12px 26px rgba(20,18,16,.18);
    transition:transform .62s var(--ease),opacity .62s var(--ease);will-change:transform}
  .dc .de{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--taupe);font-weight:600}
  .dc .dt{font-size:17px;font-weight:500;letter-spacing:-.3px;line-height:1.22;margin:7px 0 6px}
  .dc .db{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.66)}
  .dc .df{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;font-size:11.5px;color:rgba(255,255,255,.5)}
  .dc[data-p="0"]{transform:translateY(0) scale(1);opacity:1;z-index:3}
  .dc[data-p="1"]{transform:translateY(-13px) scale(.955);opacity:.9;z-index:2}
  .dc[data-p="2"]{transform:translateY(-25px) scale(.912);opacity:.72;z-index:1}
  .dc.out{transform:translateX(-14%) translateY(26px) rotate(-5deg) scale(.9);opacity:0;z-index:4}
  .dots{display:flex;gap:5px;justify-content:center;margin-top:12px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--line);transition:background .3s,width .3s}
  .dot.on{background:var(--fill);width:15px;border-radius:99px}

  /* Month view, drawn rather than embedded. A Google Calendar iframe fires its
     onload event even when the frame fails, so there is no honest way to tell a
     live embed from a blocked one; this renders the same everywhere. */
  .cal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;flex:1;margin-top:4px}
  .calm{display:flex;flex-direction:column}
  .cdow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:5px}
  .cdow span{text-align:center;font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--taupe);font-weight:600}
  .cgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:2px;flex:1}
  .cd{position:relative;display:flex;align-items:center;justify-content:center;font-size:12.5px;
    color:var(--soft);border-radius:9px;min-height:33px}
  .cd.pad{visibility:hidden}
  .cd.ev{color:var(--ink);font-weight:500;background:var(--wash)}
  .cd.ev::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--fill)}
  .cd.today{background:var(--panel);color:#fff;font-weight:600}
  .cd.today::after{background:#fff}
  .calside{display:flex;flex-direction:column;min-width:0}
  .brokeronly{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:#fff;border-radius:999px;
    padding:4px 11px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}

  .cls{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  .cls:first-of-type{border-top:0}
  .clsd{width:44px;flex-shrink:0;text-align:center}
  .clsd .m{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute)}
  .clsd .n{font-size:19px;font-weight:600;letter-spacing:-.6px;line-height:1.1}
  .clst{font-size:14px;font-weight:500;line-height:1.25}
  .clss{font-size:11.5px;color:var(--mute);margin-top:2px}
  .clsr{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}
  .faces{display:flex}
  .face{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);margin-left:-8px;background:var(--taupe);
    color:var(--panel);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;
    animation:rise .4s var(--ease) forwards}
  .face:first-child{margin-left:0} .face.me{background:var(--panel);color:#fff}
  .rsvp{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:11.5px;
    font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);transition:background .2s,color .2s,border-color .2s}
  .rsvp[aria-pressed="true"]{background:var(--fill);color:#fff;border-color:var(--fill)}
  .cnt{font-size:11.5px;color:var(--mute)}

  .viewswitch{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:11.5px;color:var(--mute)}
  .viewswitch button{border:0;background:none;padding:0;font-size:11.5px;cursor:pointer;color:var(--mute);font-family:inherit;text-decoration:underline;text-underline-offset:3px}
  .viewswitch button[aria-pressed="true"]{color:var(--ink);font-weight:600}
  .foot{font-size:11.5px;color:var(--mute);margin-top:12px;line-height:1.55}

  /* ---------- profile card: photo on the front, the details on the back ---------- */
  .flipcard{perspective:1400px;background:none;border:0;min-height:312px}
  .flipin{position:relative;width:100%;height:100%;min-height:312px;
    transform-style:preserve-3d;transition:transform .72s var(--ease)}
  .flipcard.flipped .flipin{transform:rotateY(180deg)}
  .side{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
  .side.back{transform:rotateY(180deg);background:var(--panel);color:#fff;padding:18px;border:1px solid #2a2a22;overflow-y:auto}
  .side.back .row{padding:7px 0}
  .side.front{background:var(--panel)}
  .cardbtns{position:absolute;top:14px;right:14px;display:flex;gap:6px;z-index:5}
  .cardbtn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.24);
    background:rgba(20,18,16,.5);color:#fff;font-size:13px;line-height:1;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
    transition:background .2s,transform .2s var(--ease)}
  .cardbtn:hover{background:rgba(20,18,16,.78);transform:translateY(-1px)}
  .side.back .rname{color:#fff}
  .side.back .row{border-color:rgba(255,255,255,.1)}
  .bkh{font-size:16.5px;font-weight:500;letter-spacing:-.3px;padding-right:70px}
  .bks{font-size:11.5px;color:rgba(255,255,255,.55);margin-top:2px;margin-bottom:6px}

  /* ---------- edit profile dialog ---------- */
  /* pin and centre explicitly: setting width on a dialog loses the UA's
     margin:auto and it lands in the top-left corner */
  dialog.sheet{position:fixed;inset:0;margin:auto;border:0;padding:0;border-radius:var(--r);
    max-width:480px;width:calc(100% - 32px);max-height:calc(100vh - 32px);
    background:var(--card);color:var(--ink);box-shadow:0 30px 70px rgba(20,18,16,.3)}
  dialog.sheet::backdrop{background:rgba(20,18,16,.42);backdrop-filter:blur(2px)}
  .sheet form{padding:22px;display:flex;flex-direction:column;gap:14px}
  .sheet h2{font-size:20px;font-weight:500;letter-spacing:-.6px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);font-weight:600}
  .fld input{border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:14px;
    font-family:inherit;color:var(--ink);background:var(--g1)}
  .fld input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}
  .fld input[readonly]{color:var(--mute);background:var(--wash)}
  .fld .hint{font-size:11px;color:var(--mute)}
  .sheetfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
  .btn{border-radius:999px;padding:10px 18px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .btn.primary{background:var(--fill);border-color:var(--fill);color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){.grid2{grid-template-columns:1fr}}

  /* ---------- deal volume: hover or focus a month to see what closed ---------- */
  .bcol{position:relative}
  .bcol .hit{position:absolute;inset:0;border:0;background:none;padding:0;cursor:pointer;border-radius:8px}
  .bcol .hit:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .pop{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);
    width:270px;max-width:74vw;background:var(--panel);color:#fff;border-radius:14px;padding:13px 14px;
    box-shadow:0 18px 40px rgba(20,18,16,.34);opacity:0;visibility:hidden;pointer-events:none;z-index:20;
    transition:opacity .18s var(--ease),transform .18s var(--ease),visibility .18s}
  .bcol.open .pop{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .pop::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--panel)}
  .pop .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--taupe);font-weight:600}
  .pop .pr2{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:12px;line-height:1.35;
    border-top:1px solid rgba(255,255,255,.1)}
  .pop .pr2:first-of-type{border-top:0;padding-top:9px}
  .pop .pa{min-width:0;color:rgba(255,255,255,.9)}
  .pop .pv{white-space:nowrap;font-weight:600}
  .pop .pn2{font-size:11.5px;color:rgba(255,255,255,.5);padding-top:9px}
  /* first and last month would push the bubble off the card edge */
  .bcol:first-child .pop{left:0;transform:translateX(0) translateY(4px)}
  .bcol:first-child.open .pop{transform:translateX(0) translateY(0)}
  .bcol:first-child .pop::after{left:22px}
  .bcol:last-child .pop{left:auto;right:0;transform:translateX(0) translateY(4px)}
  .bcol:last-child.open .pop{transform:translateX(0) translateY(0)}
  .bcol:last-child .pop::after{left:auto;right:22px}

  /* ---------- Today: the mission board, in this design language ---------- */
  .tdb{background:var(--panel);color:#fff;border-radius:var(--r);padding:20px}
  .tdb .lab{color:var(--taupe)}
  .tdbig{font-size:clamp(28px,3.4vw,40px);font-weight:500;letter-spacing:-1.6px;line-height:1.05;margin-top:8px}
  .tdsub{display:block;font-size:15px;font-weight:400;letter-spacing:-.3px;color:rgba(255,255,255,.5);margin-top:5px}
  .tdline{border-top:1px solid rgba(255,255,255,.14);margin-top:15px;padding-top:13px;font-size:13px;color:rgba(255,255,255,.72)}
  .tdline b{color:#fff;font-weight:600}
  .tddots{display:flex;gap:6px;margin-top:13px}
  .tddot{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.17);transition:background .4s var(--ease)}
  .tddot.on{background:var(--taupe)}
  .tdhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 4px}
  .tdrow{display:flex;gap:13px;padding:15px 0;border-top:1px solid var(--line);align-items:flex-start}
  .tdrow:first-of-type{border-top:0}
  .tdmono{width:38px;height:38px;border-radius:50%;background:var(--panel);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .tdbody{flex:1;min-width:0}
  .tdname{font-size:16px;font-weight:500;letter-spacing:-.35px}
  .tdtier{background:var(--panel);color:#fff;border-radius:999px;padding:4px 11px;font-size:10px;
    letter-spacing:1.1px;text-transform:uppercase;font-weight:600;white-space:nowrap;flex-shrink:0}
  .tdtier .cad{color:rgba(255,255,255,.55);font-weight:500}
  .tdmeta{font-size:12px;color:var(--mute);margin-top:2px}
  .tdgaps{display:flex;gap:6px;margin-top:9px;overflow-x:auto;padding-bottom:2px}
  .tdgap{background:#f7ecea;color:var(--bad);border-radius:999px;padding:4px 10px;font-size:10px;
    letter-spacing:.8px;text-transform:uppercase;font-weight:600;white-space:nowrap}
  .tdgap .mk{opacity:.55;margin-right:4px}

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function ticks(){
    var o='';
    for(var i=0;i<60;i++){
      var a=(i*6-90)*Math.PI/180,r1=89,r2=i%5===0?80:83;
      o+='<line x1="'+(89+r1*Math.cos(a)).toFixed(1)+'" y1="'+(89+r1*Math.sin(a)).toFixed(1)+
         '" x2="'+(89+r2*Math.cos(a)).toFixed(1)+'" y2="'+(89+r2*Math.sin(a)).toFixed(1)+

    }
    return o;
  }
  function donut(pct,label,sub,pace){

        'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+c.toFixed(1)+'" data-target="'+(c*(1-pct/100)).toFixed(1)+'" '+
        'transform="rotate(-90 89 89)"/></svg>'+
      '<div class="rtext"><div class="v" data-count="'+pct+'" data-suffix="%">0%</div><div class="l">'+label+'</div></div></div>'+
      '<div class="rfoot"><span>'+sub+'</span><b>'+pace+'</b></div>';

  var PROFILE={
    broker:{

  /* ---------- Today: the mission board ----------
     Same mechanic as the Hub's Today panel, restated in this design. The
     number comes from her real Goal Engine row (income 150k, avg price 350k,
     2.5% at a 100% split), which lands on 3 conversations a day worth $231
     each. Contacts, tiers, touch dates and gaps are real rows out of
     agent_contacts. Log fills a dot; Not today drops the row and pulls the
     next name up, exactly like the live board.                             */
  var TD={
    // perConv and costOfSkip are both rounded off the same unrounded
    // value-per-conversation, which is why the live Hub reads $231 and $692
    // rather than 3 x 231. Kept as the Hub reports them.
    goal:3, logged:0, perConv:231, costOfSkip:692, shown:3, tierA:22,
    people:[
      {id:'p1',name:'Yadira Rodriguez',mono:'YR',touch:null,
       gaps:['Homeowner','Home date','Wedding']},
      {id:'p2',name:'Yunier Llacer',mono:'YL',touch:null,
       gaps:['Homeowner','Address','Language','Email','Home date','Wedding']},
      {id:'p3',name:'Marycruz Martin',mono:'MM',touch:116,
       gaps:['Homeowner','Address','Wedding']},
      {id:'p4',name:'Suslay Lopez',mono:'SL',touch:null,
       gaps:['Homeowner','Wedding','Birthday']},
      {id:'p5',name:'Anna Maria Gariti',mono:'AG',touch:null,
       gaps:['Language','Email','Home date','Birthday']},
      {id:'p6',name:'Beatriz Garcia Alvarez',mono:'BA',touch:13,
       gaps:['Homeowner','Birthday']}
    ],
    done:{}, skipped:{}
  };
  function tdLive(){ return TD.people.filter(function(p){ return !TD.skipped[p.id]; }); }
  function tdBanner(){
    var n=TD.logged, m=TD.goal, done=n>=m;
    var headline = done ? (m+' of '+m+'. Number is done.') : (m+' conversation'+(m===1?'':'s')+'.');
    var sub = done ? 'Every one counted.' : (n===0 ? 'None logged yet.' : (n+' logged.'));
    var money = done
      ? 'That is <b>$'+TD.costOfSkip.toLocaleString('en-US')+'</b> of pipeline you did not leave on the table.'
      : 'Each one is worth <b>$'+TD.perConv.toLocaleString('en-US')+
        '</b>. Skip today and you are <b>$'+TD.costOfSkip.toLocaleString('en-US')+'</b> behind by tonight.';
    var dots=''; for(var i=0;i<m;i++) dots+='<div class="tddot'+(i<n?' on':'')+'"></div>';
    return '<div class="tdb"><div class="lab">Your number today</div>'+
      '<div class="tdbig">'+headline+'<span class="tdsub">'+sub+'</span></div>'+
      '<div class="tdline">'+money+'</div><div class="tddots">'+dots+'</div></div>';
  }
  function tdRows(){
    var live=tdLive(), slice=live.slice(0,TD.shown);
    if(!slice.length) return empty('Nothing left in the queue','Every name you had queued has been logged or pushed to tomorrow.');
    return slice.map(function(p){
      var state = p.touch===null ? 'Never touched' : ('Touched '+p.touch+'d ago');
      var gaps = p.gaps.map(function(g){ return '<span class="tdgap"><span class="mk">&times;</span>'+g+'</span>'; }).join('');
      var isDone=!!TD.done[p.id];
      return '<div class="tdrow'+(isDone?' done':'')+'">'+
        '<div class="tdmono">'+p.mono+'</div>'+
        '<div class="tdbody">'+
          '<div class="tdhead"><div class="tdname">'+p.name+'</div>'+
          '<span class="tdtier">Tier A <span class="cad">&middot; weekly</span></span></div>'+
          '<div class="tdmeta">'+state+'</div>'+
          (gaps?'<div class="tdgaps">'+gaps+'</div>':'')+
          '<div class="tdacts">'+
            '<button class="tdbtn" type="button">Call</button>'+
            '<button class="tdbtn" type="button">Text</button>'+
            '<button class="tdbtn dark" type="button" data-log="'+p.id+'"'+(isDone?' disabled':'')+'>'+(isDone?'Logged':'Log')+'</button>'+
            '<button class="tdbtn quiet" type="button" data-skip="'+p.id+'">Not today</button>'+
          '</div>'+
        '</div></div>';
    }).join('');
  }
  function tdBoard(){
    var live=tdLive(), hidden=Math.max(0,live.length-TD.shown);
    return '<div class="card" style="grid-area:1/1/3/3">'+
      '<div class="ch"><div class="ct">Work these, in order</div>'+
      '<span class="chip gh">'+Math.min(TD.shown,live.length)+' of '+TD.tierA+' tier A</span></div>'+
      '<div class="fill" id="tdboard">'+tdRows()+'</div>'+
      (hidden?'<button class="tdbtn tdmore" type="button" id="tdmore">Show '+hidden+' more name'+(hidden===1?'':'s')+'</button>':'')+
      '</div>';
  }
  // Re-render only the Today panels, so logging a call does not restart the
  // whole page's entrance animation.
  function tdRepaint(){
    var b=document.getElementById('tdbanner'); if(b) b.innerHTML=tdBanner();
    var g=grid; var card=document.getElementById('tdboard'); if(!card) return;
    card.innerHTML=tdRows();
    var live=tdLive(), hidden=Math.max(0,live.length-TD.shown);
    var chip=g.querySelector('.chip.gh');
    if(chip) chip.textContent=Math.min(TD.shown,live.length)+' of '+TD.tierA+' tier A';
    var more=document.getElementById('tdmore');
    if(more) more.style.display=hidden?'':'none';
    if(more && hidden) more.textContent='Show '+hidden+' more name'+(hidden===1?'':'s');
    wireToday();
  }
  function wireToday(){
    var g=grid; if(!document.getElementById('tdboard')) return;
    g.querySelectorAll('[data-log]').forEach(function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-log');
        if(TD.done[id]) return;
        TD.done[id]=1; TD.logged=Math.min(TD.goal+2,TD.logged+1);
        tdRepaint();
      };
    });
    g.querySelectorAll('[data-skip]').forEach(function(b){
      b.onclick=function(){ TD.skipped[b.getAttribute('data-skip')]=1; tdRepaint(); };
    });
    var more=document.getElementById('tdmore');
    if(more) more.onclick=function(){ TD.shown=tdLive().length; tdRepaint(); };
  }

  function pageToday(){
    return '<div class="card flush" id="tdbanner" style="grid-area:1/3/2/5;border:0;background:none">'+tdBanner()+'</div>'+
      tdBoard()+
      '<div class="card warm" style="grid-area:2/3/3/5">'+head('Where the number comes from')+
        '<div class="fill">'+
        sr('Income target','chip dk','$150,000')+
        sr('Average price','chip gh','$350,000')+
        sr('Commission &middot; split','chip gh','2.5% &middot; 100%')+
        sr('Appointment to close','chip gh','35%')+
        sr('Conversation to appointment','chip gh','8%')+
        sr('Prospecting days','chip gh','5 a week &middot; 48 weeks')+
        '</div><div class="note">Straight off your Goal Engine row. Change any of these and today&rsquo;s number moves with it.</div></div>';
  }

  function pagePipeline(){
    return '<div class="card" style="grid-area:1/1/2/3">'+head('Your open file','<span class="chip gh">draft</span>')+
        '<div class="fill" style="display:flex;flex-direction:column;justify-content:center">'+
        '<div style="font-size:20px;font-weight:500;letter-spacing:-.5px;line-height:1.25">816 Frederick Reid St E<br>Lehigh Acres, FL 33974</div>'+
        '<div class="rfoot" style="margin-top:14px"><span>Buyer side &middot; closing Aug 14</span><b style="color:var(--bad)">never submitted</b></div>'+
        '</div><div class="note">Still a draft with no commission recorded, and the closing date has already gone by.</div></div>'+
      '<div class="card warm" style="grid-area:1/3/2/5">'+head('Your listing','<span class="chip gh">1 live</span>')+
        table(['Property','Type','List price'],[
          td([nm('1201 W 11th Street, Lehigh Acres',''),'Sale','<span class="num">$345,000</span>'])
        ])+
        '<div class="note">No list date, expiry date or showings recorded against it.</div></div>'+
      '<div class="card" style="grid-area:2/1/3/5">'+head('Your closed files','<span class="chip gh">2 files &middot; $9,675</span>')+
        table(['Property','Side','Closed','GCI'],
          CLOSED.filter(function(r){return r[1]==='Marlenyi Paredes'}).map(function(r){
            return td([nm(r[0],''),r[2],'<span class="num">'+r[3]+'</span>','<span class="num">'+money(r[4])+'</span>']); }))+
        '<div class="note">Both seller side. 1109 Congress Ave carried almost all of it.</div></div>';
  }

  function pagePlan(){
    return '<div class="card warm" style="grid-area:1/1/2/3">'+head('100% Max','<span class="chip dk">fee exempt</span>')+
        '<div class="split"><i style="flex:100;background:var(--fill);color:#fff">100% you</i></div>'+
        '<div class="fill" style="margin-top:8px">'+sr('Your split','chip gh','1.00')+
        sr('Monthly fee','chip gh','exempt &mdash; $0')+sr('Billing row','chip gh','none, by design')+
        sr('E&amp;O + compliance','chip gh','covered')+'</div>'+
        '<div class="note">Set on your realty_members record as commission_plan 100_max with fee_exempt true.</div></div>'+
      '<div class="card" style="grid-area:1/3/2/5">'+head('Toward your goal')+
        '<div class="fill" style="display:flex;flex-direction:column;justify-content:center">'+
        '<div class="big">$9,675</div><div class="bigsub">of a $15,000 illustrative goal</div>'+
        '<div class="rbar" style="margin-top:16px;flex:0 0 10px"><i data-w="65"></i></div>'+
        '</div><div class="note">No goal is stored in realty_agent_goals for you, so the target here is illustrative.</div></div>'+
      '<div class="card dark" style="grid-area:2/1/3/5">'+head('Still open on your side')+
        '<div class="fill">'+
        flag('Your ICA is not signed','agreement_signed reads false on your record, with no signature date and no stored PDF.')+
        flag('A draft file is sitting past its closing date','816 Frederick Reid St E was due to close Aug 14 and has never been submitted.')+
        flag('Your profile is 18% complete','Most fields are empty, and the roster and directory both read from them.',1)+
        flag('Ten training items are outstanding','None have been completed by anyone on the roster yet.',1)+
        '</div></div>';
  }

  function pageDatabase(){
    return '<div class="card" style="grid-area:1/1/2/2">'+head('Contacts')+
        '<div class="fill"></div><div class="big">207</div><div class="bigsub">in your name</div></div>'+
      '<div class="card warm" style="grid-area:1/2/2/3">'+head('Tiered')+
        '<div class="fill"></div><div class="big">207</div><div class="bigsub">all of them</div></div>'+
      '<div class="card" style="grid-area:1/3/2/4">'+head('Next action set')+
        '<div class="fill"></div><div class="big" style="color:var(--bad)">0</div><div class="bigsub">nothing scheduled</div></div>'+
      '<div class="card dark" style="grid-area:1/4/2/5">'+head('Company total')+
        '<div class="fill"></div><div class="big" style="color:#fff">223</div><div class="bigsub">across the brokerage</div></div>'+
      '<div class="card" style="grid-area:2/1/3/5">'+head('How the database splits')+
        '<div class="fill" style="display:flex;flex-direction:column;justify-content:center">'+
        lr('Marlenyi Paredes','you',100,'207')+
        lr('Eileen Hernandez','transaction coordinator',5,'10')+
        lr('Milennys Vargas','agent',3,'6')+
        lr('Everyone else','no contacts imported',0,'0')+
        '</div><div class="note">You hold 93% of the company database. Nobody else has imported a book.</div></div>';
  }

  var NB='<div class="bignum"><div class="v" data-count="6">0</div><div class="l">Agents</div></div>'+
         '<div class="bignum"><div class="v" data-count="4">0</div><div class="l">Pipeline</div></div>'+
         '<div class="bignum"><div class="v" data-count="10">0</div><div class="l">Closed</div></div>';
  var NA='<div class="bignum"><div class="v" data-count="9675" data-money="1">$0</div><div class="l">Earned</div></div>'+
         '<div class="bignum"><div class="v" data-count="2">0</div><div class="l">Closed</div></div>'+
         '<div class="bignum"><div class="v" data-count="1">0</div><div class="l">Listed</div></div>';
  var FB='Live from the Aari database: 7 active seats plus one suspended, 4 files in pipeline totalling $1,395,799, and 10 genuine closings — the 52 paid rows include 42 legacy imports. 2 files awaiting review, 5 live announcements. Classes, calendar entries, goal target and execution splits are illustrative.';
  var FA='Your own producer side, live from the Aari database: 2 closed files worth $9,675, one active listing at $345,000, one unsubmitted draft, 207 contacts, on 100% Max fee exempt. The income goal and the classes are illustrative.';

  var grid=document.getElementById('grid'),nums=document.getElementById('nums'),greet=document.getElementById('greet'),
      foot=document.getElementById('foot'),av=document.getElementById('av'),
      tb=document.getElementById('tb'),ta=document.getElementById('ta'),trk=document.getElementById('trk'),
      m1k=document.getElementById('m1k'),m1v=document.getElementById('m1v'),
      m2k=document.getElementById('m2k'),m2v=document.getElementById('m2v'),
      nav=document.getElementById('nav'),strip=document.querySelector('.strip');

  function countUp(el){
    var to=+el.getAttribute('data-count'), money=el.getAttribute('data-money'), sfx=el.getAttribute('data-suffix')||'';
    if(reduce){ el.textContent=(money?'$':'')+to.toLocaleString()+sfx; return; }
    var t0=null, dur=1150;
    function step(t){
      if(!t0)t0=t;
      var k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3), v=Math.round(to*e);
      el.textContent=(money?'$':'')+v.toLocaleString()+sfx;
      if(k<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function animate(){
    // rings sweep from empty to their real value
    [].forEach.call(document.querySelectorAll('.ring'),function(r){
      if(reduce){ r.style.strokeDashoffset=r.getAttribute('data-target'); return; }
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        r.style.strokeDashoffset=r.getAttribute('data-target');
      });});
    });
    [].forEach.call(document.querySelectorAll('.bfill'),function(b,i){
      var h=b.getAttribute('data-h')+'%';
      if(reduce){ b.style.height=h; return; }
      b.style.transitionDelay=(0.28+i*0.07)+'s';
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ b.style.height=h; });});
    });
    [].forEach.call(document.querySelectorAll('.rbar i'),function(b){
      var w=b.getAttribute('data-w')+'%';
      if(reduce){ b.style.width=w; return; }
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ b.style.width=w; });});
    });
    [].forEach.call(document.querySelectorAll('[data-count]'),countUp);
    if(trk){ if(reduce) trk.style.width='52%'; else requestAnimationFrame(function(){ trk.style.width='52%'; }); }
    [].forEach.call(grid.children,function(c,i){
      c.classList.add('anim'); c.style.animationDelay=(0.08+i*0.055)+'s';
    });
  }

  function startDeck(){
    if(deckTimer){ clearInterval(deckTimer); deckTimer=null; }
    var d=document.getElementById('deck'); if(!d) return;
    var cards=[].slice.call(d.children), order=cards.map(function(_,i){return i});
    function paint(){ order.forEach(function(idx,pos){ cards[idx].setAttribute('data-p',pos); });
      var dots=document.querySelectorAll('#dots .dot');
      [].forEach.call(dots,function(x,i){ x.classList.toggle('on', i===order[0]); });
    }
    function next(){
      var top=cards[order[0]];
      if(reduce){ order.push(order.shift()); paint(); return; }
      top.classList.add('out');
      setTimeout(function(){
        order.push(order.shift());
        top.classList.remove('out');
        paint();
      },430);
    }
    paint();
    var btn=document.getElementById('deck-next');
    if(btn) btn.onclick=function(){ next(); restart(); };
    function restart(){ if(deckTimer) clearInterval(deckTimer); if(!reduce) deckTimer=setInterval(next,5200); }
    restart();
  }

  /* ---------- profile card: flip and edit ---------- */
  var dlg=document.getElementById('edit'), form=document.getElementById('editform');
  // Reach the inputs by id, not through form.<name>. A form exposes its own
  // name and title properties, so form.name and form.title hand back the
  // form's attributes rather than these two fields, and every save silently
  // kept the old value.
  var FIELDS=['name','title','licence','phone','email','area'];
  function fld(k){ return document.getElementById('f-'+k); }
  function wireProfile(){
    var card=document.getElementById('pcard'); if(!card) return;
    var flip=document.getElementById('pflip'), gear=document.getElementById('pgear');
    flip.onclick=function(){
      var on=card.classList.toggle('flipped');
      flip.setAttribute('aria-pressed',on?'true':'false');
      flip.setAttribute('aria-label',on?'Show the photo':'Flip the card');
    };
    gear.onclick=function(){
      var p=PROFILE[role];
      FIELDS.forEach(function(k){ fld(k).value=p[k]; });
      fld('plan').value=(role==='broker')?'Broker of record — not on an agent plan'
                                         :'100% Max · fee exempt · split 1.00';
      dlg.showModal();
    };
  }
  document.getElementById('editcancel').onclick=function(){ dlg.close(); };
  form.addEventListener('submit',function(){
    // method="dialog" closes on its own; commit the values to PROFILE so the
    // card, its back and the greeting all move together on the next paint
    var p=PROFILE[role];
    FIELDS.forEach(function(k){
      var v=fld(k).value.trim();
      // name and title carry the card, so an empty box keeps what was there
      if(v || (k!=='name' && k!=='title')) p[k]=v;
    });
    var wasFlipped=document.getElementById('pcard').classList.contains('flipped');
    render();
    if(wasFlipped){
      var c=document.getElementById('pcard');
      if(c){ c.classList.add('flipped'); document.getElementById('pflip').setAttribute('aria-pressed','true'); }
    }
  });

  // Month popovers open on hover and on keyboard focus, and close on Escape,
  // so the closings behind a bar are reachable without a mouse.
  function wireBars(){
    [].forEach.call(grid.querySelectorAll('.bcol'),function(col){
      var hit=col.querySelector('.hit'); if(!hit) return;
      var open=function(){ col.classList.add('open'); };
      var shut=function(){ col.classList.remove('open'); };
      col.onmouseenter=open; col.onmouseleave=shut;
      hit.onfocus=open; hit.onblur=shut;
      hit.onclick=function(){ col.classList.toggle('open'); };
      hit.onkeydown=function(e){ if(e.key==='Escape'){ shut(); hit.blur(); } };
    });
  }

  function wireRsvp(){
    [].forEach.call(grid.querySelectorAll('.rsvp'),function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-id'), on=b.getAttribute('aria-pressed')==='true', l=ATTEND[id];
        if(on) ATTEND[id]=l.filter(function(x){return x!==ME});
        else if(l.indexOf(ME)<0) l.push(ME);
        b.setAttribute('aria-pressed', on?'false':'true');
        b.innerHTML = on ? 'I&rsquo;m attending' : 'Attending &#10003;';
        var wrap=b.parentNode;
        while(wrap.lastChild && wrap.lastChild!==b) wrap.removeChild(wrap.lastChild);
        var tmp=document.createElement('div'); tmp.innerHTML=faces(id);
        while(tmp.firstChild) wrap.appendChild(tmp.firstChild);
      };
    });
  }

  /* ---------- tabs ----------
     Each role gets its own tab list, mirroring what that role actually
     reaches in the Hub sidebar. Dashboard is the deck already built above;
     everything else is a page function.                                   */
  var TABS={
    broker:[['Dashboard',null],['Team',pageTeam],['Deals',pageDeals],['Money',pageMoney],
            ['Announcements',pageAnn],['Classes',pageClasses],['Compliance',pageCompliance]],
    agent: [['Dashboard',null],['Today',pageToday],['Pipeline',pagePipeline],['Database',pageDatabase],
            ['Announcements',pageAnn],['Classes',pageClasses],['My plan',pagePlan]]
  };
  // Foot notes per page, so the caveat under the grid always matches what
  // is on screen rather than describing the dashboard from every tab.
  var TABFOOT={
    Team:'realty_members is the roster of record: 7 active seats plus Ana Puentes suspended. Logins, activation dates, commission plans and splits are live. Production joins realty_transactions excluding legacy imports.',
    Deals:'All 20 rows are live realty_transactions and realty_listings. The database holds 56 transaction rows; 42 are legacy imports and are excluded throughout.',
    Money:'GCI, expenses, invoices, listing values and every plan row are live. Nothing on this page is illustrative.',
    Announcements:'All five posts, their urgency, acknowledgement flags, recipient lists and read counts are live out of realty_announcements and realty_announcement_reads.',
    Compliance:'Signature state, training items, licence numbers and expiry dates are live. The empty document and deadline tables are genuinely empty, not unwired.',
    Classes:'The three classes are written into this page — realty_events has no rows yet. RSVPs are live in the browser only.',
    Today:'Your contact counts, the stalled draft and the unsigned ICA are live. The streak figure and the class dates are illustrative.',
    Pipeline:'Every file and listing on this page is live for you out of realty_transactions and realty_listings.',
    Database:'All contact counts are live out of agent_contacts.',
    'My plan':'Your plan, split and exempt status are live out of realty_members. The $15,000 goal is illustrative — realty_agent_goals holds nothing for you.'
  };

  var role='broker', tab='Dashboard';

  function paintNav(){
    nav.innerHTML=TABS[role].map(function(t){
      return '<a href="#" data-t="'+t[0]+'"'+(t[0]===tab?' class="on"':'')+'>'+t[0]+'</a>';
    }).join('');
    [].forEach.call(nav.children,function(a){
      a.onclick=function(e){ e.preventDefault(); tab=a.getAttribute('data-t'); render(); };
    });
  }

  function render(){
    var isB=role==='broker';
    var entry=TABS[role].filter(function(t){return t[0]===tab})[0];
    // a tab that only exists for the other role falls back to the dashboard
    if(!entry){ tab='Dashboard'; entry=TABS[role][0]; }

    grid.innerHTML = entry[1] ? entry[1]() : (isB?BROKER():AGENT());
    nums.innerHTML=isB?NB:NA;
    // the greeting follows whatever display name the profile editor holds
    var first=PROFILE[role].name.split(/\s+/)[0];
    greet.textContent=(tab==='Dashboard')?('Good morning, '+first):(first+' · '+tab);
    // first + last initial, so a middle initial in the name does not push
    // the surname out (Marlenyi L. Paredes is MP, not ML)
    var wds=PROFILE[role].name.trim().split(/\s+/).filter(Boolean);
    av.textContent=((wds[0]||'')[0]||'')+(wds.length>1?((wds[wds.length-1]||'')[0]||''):'');
    av.textContent=av.textContent.toUpperCase();
    // The two pills either side of the month track are per-role: the broker
    // watches the company book, an agent watches their own file and their day.
    m1k.textContent=isB?'In pipeline':'Your listings'; m1v.textContent=isB?'4 deals':'1 live';
    m2k.textContent=isB?'Awaiting you':'Unsubmitted';  m2v.textContent=isB?'2 files':'1 draft';
    foot.textContent=TABFOOT[tab]||(isB?FB:FA);
    ME='MP';
    tb.setAttribute('aria-pressed',isB); ta.setAttribute('aria-pressed',!isB);
    if(trk) trk.style.width='0';
    strip.classList.toggle('tabbed',tab!=='Dashboard');
    paintNav();
    animate(); wireRsvp(); startDeck(); wireProfile(); wireToday(); wireBars();
  }

  function setRole(r){ role=r; render(); }
  tb.onclick=function(){setRole('broker')}; ta.onclick=function(){setRole('agent')};
  render();
})();
</script>
