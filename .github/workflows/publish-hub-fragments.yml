name: Publish Hub Fragments

# Stage 2a — auto-publish gate.
# Whenever hub_payload.html, hub_next.html, tx_module.html, or broker_module.html
# changes on main,
# publish ONLY the file(s) that actually changed in this push into the private
# Supabase Storage bucket that realty-hub reads from at runtime. hub-file-io backs
# up whatever it overwrites (<path>.BACKUP-<timestamp>.html) before writing, so
# every publish is reversible on the bucket side too - not just in git.
#
# Deliberately selective: a push that only touches hub_payload.html will publish
# ONLY hub_payload.html. tx_module.html is never re-uploaded unless tx_module.html
# itself changed in the diff.
#
# Rollback in one line: git revert the bad commit and push to main. This workflow
# republishes only the reverted file(s) automatically. No manual bucket edits.

on:
  push:
    branches: [main]
    paths:
      - 'hub_payload.html'
      - 'hub_next.html'
      - 'tx_module.html'
      - 'broker_module.html'
      - 'brand/**'
      - 'agreements/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine which fragment(s) changed in this push
        id: changed
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --pretty=format: HEAD)
          else
            DIFF=$(git diff --name-only "$BEFORE" "$AFTER")
          fi
          echo "Full diff for this push:"
          echo "$DIFF"
          FILES=""
          for f in hub_payload.html hub_next.html tx_module.html broker_module.html; do
            if echo "$DIFF" | grep -qx "$f"; then
              FILES="$FILES $f"
            fi
          done
          echo "Fragments to publish:$FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Publish changed fragment(s) to Supabase Storage
        if: steps.changed.outputs.files != ''
        env:
          IO_SECRET: ${{ secrets.HUB_IO_SECRET }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -e
          if [ -z "$IO_SECRET" ]; then
            echo "::error::HUB_IO_SECRET repository secret is not set. Add it under Settings > Secrets and variables > Actions before this workflow can publish."
            exit 1
          fi
          IO_SECRET=$(printf '%s' "$IO_SECRET" | tr -d '\r\n')
          for f in $FILES; do
            echo "Publishing $f..."
            HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST \
              "https://fnlrgmuvtgwzjsihqxcn.supabase.co/functions/v1/hub-file-io?path=$f" \
              -H "x-io-secret: $IO_SECRET" \
              -H "Content-Type: text/html; charset=utf-8" \
              --data-binary @"$f")
            echo "Response code: $HTTP_CODE"
            cat /tmp/resp.json
            echo ""
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Publish failed for $f (HTTP $HTTP_CODE)"
              exit 1
            fi
          done

          echo "Done. Published:$FILES"

      - name: Determine which binary file(s) changed in this push
        id: brand
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --pretty=format: HEAD)
          else
            DIFF=$(git diff --name-only "$BEFORE" "$AFTER")
          fi
          # Deleted files are skipped: this step uploads, it never removes.
          FILES=""
          for f in $(echo "$DIFF" | grep -E '^(brand|agreements)/' || true); do
            if [ -f "$f" ]; then FILES="$FILES $f"; fi
          done
          echo "Binary files to publish:$FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      # Logos and published agreement versions are binary, so they go up base64
      # in a JSON body rather than as the raw text a fragment uses. The bytes
      # never leave this runner in any other form, and hub-file-io answers with
      # the sha256 of what it actually stored so a truncated upload fails here
      # rather than showing an agent a broken file or half an agreement.
      #
      # An agreement version already in storage is never overwritten: the
      # function answers 409 and the run fails, because a version somebody may
      # already have signed must not change underneath them.
      - name: Publish changed brand and agreement file(s) to Supabase Storage
        if: steps.brand.outputs.files != ''
        env:
          IO_SECRET: ${{ secrets.HUB_IO_SECRET }}
          FILES: ${{ steps.brand.outputs.files }}
        run: |
          set -e
          if [ -z "$IO_SECRET" ]; then
            echo "::error::HUB_IO_SECRET repository secret is not set."
            exit 1
          fi
          IO_SECRET=$(printf '%s' "$IO_SECRET" | tr -d '\r\n')
          for f in $FILES; do
            echo "Publishing $f..."
            LOCAL_SHA=$(sha256sum "$f" | cut -d' ' -f1)
            base64 -w0 "$f" | python3 -c 'import sys,json; sys.stdout.write(json.dumps({"content": sys.stdin.read()}))' > /tmp/brand.json
            HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST \
              "https://fnlrgmuvtgwzjsihqxcn.supabase.co/functions/v1/hub-file-io?path=$f" \
              -H "x-io-secret: $IO_SECRET" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/brand.json)
            cat /tmp/resp.json; echo ""
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Publish failed for $f (HTTP $HTTP_CODE)"
              exit 1
            fi
            REMOTE_SHA=$(python3 -c 'import json;print(json.load(open("/tmp/resp.json")).get("sha256",""))')
            if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
              echo "::error::$f arrived different from what was sent. local $LOCAL_SHA, stored $REMOTE_SHA"
              exit 1
            fi
            echo "$f verified, sha256 $REMOTE_SHA"
          done
          echo "Done. Published:$FILES"

      - name: Nothing to publish
        if: steps.changed.outputs.files == '' && steps.brand.outputs.files == ''
        run: echo "No tracked fragment or brand file changed in this push - nothing published."
