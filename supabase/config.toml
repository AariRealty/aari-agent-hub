# Per-function settings the deploy workflow relies on.
#
# The CLI defaults verify_jwt to true. Several functions in this project run with
# it off and do their own authentication instead, so a deploy that does not know
# which is which would silently turn the gate on and break them. Every function in
# this repository is declared here at the value it is actually serving on, so the
# setting travels with the code rather than living only in the dashboard.
#
# Anything added here with verify_jwt = false must say so in this file before it
# is first deployed by the workflow.

# A larger gap, recorded here because this is where someone will look for it.
# The project has 174 deployed edge functions. Six of them have source in this
# repository, the six declared below. The other 168 exist only as deployed code,
# with no file to review, no history, and no way to reproduce them if one is lost
# or changed by hand. realty-sign-ica, realty-sign-ica-web and hub-file-io were all
# edited on 7 September and none of them has a home here. That is the same problem
# as the missing deploy path, one level up, and it is not fixed by this file.

project_id = "fnlrgmuvtgwzjsihqxcn"

# Authenticates the signer itself from the Authorization header, so the platform
# gate stays off. Declared explicitly because the CLI would otherwise default it on.
[functions.realty-sign-ica]
verify_jwt = false

[functions.realty-hub]
verify_jwt = true

[functions.extract-contract-fields]
verify_jwt = true

[functions.masterdata-import]
verify_jwt = true

[functions.realty-agent-invite]
verify_jwt = true

[functions.realty-calendar-share]
verify_jwt = true

[functions.realty-tx-review]
verify_jwt = true

# Bucket write tools. Both authenticate themselves against
# realty_config.hub_io_secret and hub_io_secret_next, the same pair hub-file-io
# uses, so the platform gate stays off and the credential is one that can be
# rotated. Both used to accept realty_config.digest_cron_secret, which at least
# eight functions share, which made them a second door onto every bucket while
# publishing was closed at the front one.
[functions.realty-hub-fileio]
verify_jwt = false

[functions.put-frag]
verify_jwt = false

# generate-signed-agreement-pdf, changed 7 September 2026 and deployed as version
# 35, is one of the 168 with no source here. It was given an in-code service role
# bearer check because it ran with no authentication of any kind on a signing
# path. The change was made against the deployed source through the management
# API, not from a file in this repository, so there is still nothing to review and
# nothing to diff against. It is deliberately not copied in here: a hand
# transcribed copy of a live signing function would be deployed over the real one
# by the workflow above on the next push, and a single wrong character in the PDF
# composition would be silent. Bringing it in needs its true source, which means
# SUPABASE_ACCESS_TOKEN and a pull rather than a retype.

# --------------------------------------------------------------------------
# Added 7 September 2026, with the four functions landed from stranded branches
# and the three touched in the SWEEP slice 2 pass.
# --------------------------------------------------------------------------

# Landed from claude/county-lookup, claude/clause-register and
# claude/ica-soft-gate after their content was verified against what is running.
# All three authenticate themselves in the body; realty-ica-notice reads the user
# from a posted token the same way realty-sign-ica does, which is why the gate is
# off and the check is inside.
[functions.realty-ica-notice]
verify_jwt = false

[functions.realty-parcel-lookup]
verify_jwt = true

[functions.realty-heartbeat]
verify_jwt = true

[functions.realty-clause-register]
verify_jwt = true

# Two routes to the commission book, both previously gated by a literal and both
# now reading their gate from the environment with no default.
#
# skyslope-tm served with verify_jwt off. Deploying it through the management API
# on 7 September set the flag to true, because that path does not read this file
# and always turns the gate on. That is recorded rather than reverted: nothing
# calls this function, it refuses everything until SKYSLOPE_TM_SYNC_TOKEN is set,
# and requiring a platform token in front of its own token is stricter than what
# it had. Declared true here so the workflow does not churn it back.
[functions.skyslope-tm]
verify_jwt = true

[functions.realty-skyslope-sync]
verify_jwt = true

# MUST STAY FALSE, and this is the reason it has not been deployed by hand.
#
# Every effective-date email already in an agent's inbox carries a plain link back
# to this function: a GET with a token and no key of any kind. Turning the gate on
# rejects those at the gateway before the function runs, so every confirm link
# already sent stops working. The management API deploy path always turns the gate
# on and cannot be told otherwise, which is why the v17 source sits in this
# repository undeployed and waits for the workflow, which reads this file.
[functions.effective-date-confirm]
verify_jwt = false

# Retired. Returns 410 and nothing else. Kept declared so the workflow does not
# turn a gate on in front of a tombstone and turn a clear 410 into a 401.
[functions.realty-upload-base]
verify_jwt = false

# The two weekly senders. Both already served with the platform gate on, which the
# public anon key satisfies, so the real check is the service role test inside each
# one. Declared so the workflow leaves them where they are.
[functions.tc-invoice-reminder]
verify_jwt = true

[functions.tc-invoice-unpaid-reminder]
verify_jwt = true

# Retired 7 September 2026, same reasoning as realty-upload-base. Declared so the
# workflow does not put a gate in front of a tombstone.
[functions.hotfix-broker-module-2026-08-12]
verify_jwt = true
