# Per-function settings the deploy workflow relies on.
#
# The CLI defaults verify_jwt to true. Several functions in this project run with
# it off and do their own authentication instead, so a deploy that does not know
# which is which would silently turn the gate on and break them. Every function in
# this repository is declared here at the value it is actually serving on, so the
# setting travels with the code rather than living only in the dashboard.
#
# All six are currently true, confirmed against the deployed functions on
# 7 September 2026. Anything added here later with verify_jwt = false must say so
# in this file before it is first deployed by the workflow.

# A larger gap, recorded here because this is where someone will look for it.
# The project has 174 deployed edge functions. Six of them have source in this
# repository, the six declared below. The other 168 exist only as deployed code,
# with no file to review, no history, and no way to reproduce them if one is lost
# or changed by hand. realty-sign-ica, realty-sign-ica-web and hub-file-io were all
# edited on 7 September and none of them has a home here. That is the same problem
# as the missing deploy path, one level up, and it is not fixed by this file.

project_id = "fnlrgmuvtgwzjsihqxcn"

# Authenticates the signer itself from the Authorization header, so the platform
# gate stays off. Declared explicitly because the CLI would otherwise default it on.
[functions.realty-sign-ica]
verify_jwt = false

[functions.realty-hub]
verify_jwt = true

[functions.extract-contract-fields]
verify_jwt = true

[functions.masterdata-import]
verify_jwt = true

[functions.realty-agent-invite]
verify_jwt = true

[functions.realty-calendar-share]
verify_jwt = true

[functions.realty-tx-review]
verify_jwt = true

# generate-signed-agreement-pdf, changed 7 September 2026 and deployed as version
# 35, is one of the 168 with no source here. It was given an in-code service role
# bearer check because it ran with no authentication of any kind on a signing
# path. The change was made against the deployed source through the management
# API, not from a file in this repository, so there is still nothing to review and
# nothing to diff against. It is deliberately not copied in here: a hand
# transcribed copy of a live signing function would be deployed over the real one
# by the workflow above on the next push, and a single wrong character in the PDF
# composition would be silent. Bringing it in needs its true source, which means
# SUPABASE_ACCESS_TOKEN and a pull rather than a retype.
