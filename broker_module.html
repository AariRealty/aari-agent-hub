<!--AARI_BROKER_MODULE-->
<script>
(function(){
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtDate(d){return d?new Date(d).toLocaleDateString():'—';}
var TXL={residential_sale:'Residential Sale',residential_lease:'Residential Lease',commercial_sale:'Commercial Sale',commercial_lease:'Commercial Lease'};
var STX={draft:'Draft',submitted:'In Review',approved:'Ready to Pay',paid:'Paid'};
var SDOC={missing:'Not uploaded',uploaded:'Awaiting review',approved:'Approved',rejected:'Rejected'};
function chip(text,tone){var colors={ok:'#1a6b3c',warn:'#8a6d1a',bad:'#B04040',mut:'#6a6a6a'};return '<span style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:'+(colors[tone]||'#6a6a6a')+';">'+esc(text)+'</span>';}
function toneTx(s){return s==='paid'||s==='approved'?'ok':s==='submitted'?'warn':'mut';}
function toneDoc(s){return s==='approved'?'ok':s==='uploaded'?'warn':s==='rejected'?'bad':'mut';}
function money(n){return (n==null||n==='')?'—':'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});}
var PLANS={'75_25':'75 / 25','85_15':'85 / 15','100_max':'100% Max'};
var B_CURRENT=null;

async function apiCall(fn,body){
  var s=await sb.auth.getSession(); var session=s.data.session;
  if(!session)throw new Error('Session expired. Refresh the page.');
  var r=await fetch(SB_URL+'/functions/v1/'+fn,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SB_KEY},body:JSON.stringify(body)});
  var j=await r.json().catch(function(){return {};});
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function adminCall(b){return apiCall('realty-admin',b);}
function btx(b){return apiCall('realty-tx',b);}

/* ================= roster (control panel) ================= */
function checklistTotal(){var n=document.querySelectorAll('input[type="checkbox"][data-check]').length;return n||1;}
async function loadRoster(){
  var box=document.getElementById('bcp-roster');
  box.innerHTML='<p style="font-size:13px;color:#6a6a6a;">Loading roster…</p>';
  try{
    var j=await adminCall({action:'list'});
    var total=checklistTotal();
    var rows=j.members.map(function(m){
      var pct=Math.min(100,Math.round(100*(m.checklist_done||0)/total));
      var last=m.last_login_at?new Date(m.last_login_at).toLocaleDateString():'—';
      var actions='';
      if(m.role!=='broker'){
        actions=(m.status==='active'
          ?'<button class="btn-link-dark" style="margin:0 10px 0 0;" onclick="bcpSetStatus(\''+m.user_id+'\',\'suspended\',\''+esc(m.full_name)+'\')">Deactivate</button>'
          :'<button class="btn-link-dark" style="margin:0 10px 0 0;" onclick="bcpSetStatus(\''+m.user_id+'\',\'active\',\''+esc(m.full_name)+'\')">Reactivate</button>')
          +'<button class="btn-link-dark" style="margin:0;" onclick="bcpResetPw(\''+m.user_id+'\',\''+esc(m.full_name)+'\')">Reset&nbsp;PW</button>';
      }
      var planCell='<select class="form-select" id="plan-'+m.user_id+'" style="padding:5px 8px;font-size:11px;width:auto;">'
        +'<option value=""'+(!m.commission_plan?' selected':'')+'>— none —</option>'
        +'<option value="75_25"'+(m.commission_plan==='75_25'?' selected':'')+'>75/25 · $59</option>'
        +'<option value="85_15"'+(m.commission_plan==='85_15'?' selected':'')+'>85/15 · $79</option>'
        +'<option value="100_max"'+(m.commission_plan==='100_max'?' selected':'')+'>100% Max · $99</option></select>'
        +'<label style="font-size:10px;display:block;margin-top:4px;cursor:pointer;"><input type="checkbox" id="fx-'+m.user_id+'"'+(m.fee_exempt?' checked':'')+' style="width:auto;margin:0 4px 0 0;vertical-align:middle;">fee exempt</label>'
        +'<button class="btn-link-dark" style="margin:4px 0 0;" onclick="bcpSavePlan(\''+m.user_id+'\')">Save plan</button>';
      return '<tr'+(m.status!=='active'?' style="opacity:.5;"':'')+'>'
        +'<td><strong>'+esc(m.full_name)+'</strong><br><span style="color:#8a8a8a;font-size:11px;">'+esc(m.email||'')+'</span></td>'
        +'<td>'+esc(m.license_number||'—')+'</td>'
        +'<td style="text-transform:uppercase;font-size:10.5px;letter-spacing:1px;">'+esc(m.role)+'</td>'
        +'<td>'+(m.status==='active'?'Active':'Suspended')+(m.must_change_password?'<br><span style="color:#B04040;font-size:10px;">temp&nbsp;pw</span>':'')+'</td>'
        +'<td>'+planCell+'</td>'
        +'<td>'+last+'</td>'
        +'<td>'+pct+'%</td>'
        +'<td style="white-space:nowrap;">'+actions+'</td></tr>';
    }).join('');
    box.innerHTML='<table class="history-table"><thead><tr><th>Agent (STAGE2A GATE TEST)</th><th>License</th><th>Role</th><th>Status</th><th>Plan</th><th>Last Login</th><th>Onboarding</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table>';  }catch(e){box.innerHTML='<div class="flag-alert"><div class="flag-title">Error</div><div class="flag-body">'+esc(e.message)+'</div></div>';}
}
function showSecret(title,email,pw){
  var el=document.getElementById('bcp-invite-result');
  el.style.display='block';
  el.innerHTML='<div class="flag-alert" style="border-left-color:#000;background:#f4f1e8;"><div class="flag-title" style="color:#000;">'+esc(title)+'</div>'
    +'<div class="flag-body"><strong>'+esc(email)+'</strong><br>Temporary password: <strong style="font-size:15px;letter-spacing:1px;">'+esc(pw)+'</strong></div>'
    +'<div class="flag-meta">Shown once. It is not stored anywhere. Deliver it to the agent directly. They must change it at first login.</div></div>';
}
async function inviteAgent(e){
  e.preventDefault();
  var f=e.target,btn=f.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Creating…';
  try{
    var j=await adminCall({action:'invite',full_name:f.full_name.value.trim(),email:f.email.value.trim().toLowerCase(),license_number:f.license_number.value.trim(),phone:f.phone.value.trim()});
    showSecret('Agent account created',j.email,j.temp_password);
    f.reset();loadRoster();
  }catch(err){alert('Could not create agent: '+err.message);}
  btn.disabled=false;btn.textContent='Create Agent Account';
}
window.bcpSetStatus=async function(uid,status,name){
  if(!confirm((status==='suspended'?'Deactivate ':'Reactivate ')+name+'? '+(status==='suspended'?'They lose portal access immediately.':'')))return;
  try{await adminCall({action:'set_status',user_id:uid,status:status});loadRoster();}catch(e){alert(e.message);}
};
window.bcpResetPw=async function(uid,name){
  if(!confirm('Reset password for '+name+'? Their current password stops working immediately.'))return;
  try{var j=await adminCall({action:'reset_password',user_id:uid});showSecret('Password reset · '+name,j.email||'',j.temp_password);}catch(e){alert(e.message);}
};
window.bcpSavePlan=async function(uid){
  var plan=document.getElementById('plan-'+uid).value;
  var fx=document.getElementById('fx-'+uid).checked;
  if(!plan){alert('Pick a plan first.');return;}
  try{await adminCall({action:'set_plan',user_id:uid,commission_plan:plan,fee_exempt:fx});loadRoster();}catch(e){alert(e.message);}
};
window.bcpProvisionPending=async function(email,fullName,btn){
  if(!confirm('Send a real login-invite email to '+fullName+' ('+email+') right now? This creates their account and emails them access immediately. This cannot be undone.'))return;
  btn.disabled=true;var t=btn.textContent;btn.textContent='Sending…';
  try{
    var j=await apiCall('realty-provision-pending-agent',{email:email,full_name:fullName});
    btn.textContent=j.already_exists?'Already has account':(j.emailed_agent?'Invite sent ✓':'Account created (email may have failed)');
    loadRoster();
  }catch(e){
    alert(e.message);btn.disabled=false;btn.textContent=t;
  }
};

/* ================= transaction review ================= */
async function loadQueue(){
  var box=document.getElementById('btx-box');
  box.innerHTML='<p style="font-size:13px;color:#6a6a6a;">Loading queue…</p>';
  try{
    var j=await btx({action:'queue'});
    if(!j.transactions.length){box.innerHTML='<div class="panel-sub">No submitted transactions yet.</div>';return;}
    var open=j.transactions.filter(function(t){return t.status!=='paid';});
    var paid=j.transactions.filter(function(t){return t.status==='paid';});
    function table(list){
      return '<table class="history-table"><thead><tr><th>Agent</th><th>Property</th><th>Type</th><th>Status</th><th>To Review</th><th>Approved</th><th>Submitted</th><th></th></tr></thead><tbody>'
        +list.map(function(t){
          return '<tr><td><strong>'+esc(t.agent_name)+'</strong></td><td>'+esc(t.property_address)+'</td><td>'+esc(TXL[t.tx_type]||t.tx_type)+'</td>'
          +'<td>'+chip(STX[t.status]||t.status,toneTx(t.status))+'</td>'
          +'<td>'+(t.doc_pending>0?'<strong style="color:#8a6d1a;">'+t.doc_pending+'</strong>':'0')+(t.doc_rejected>0?' · <span style="color:#B04040;">'+t.doc_rejected+' rejected</span>':'')+'</td>'
          +'<td>'+t.doc_approved+' / '+t.doc_total+'</td><td>'+fmtDate(t.submitted_at)+'</td>'
          +'<td><button class="btn-link-dark" style="margin:0;" onclick="bTxOpen(\''+t.id+'\')">Review</button></td></tr>';
        }).join('')+'</tbody></table>';
    }
    box.innerHTML='<div class="panel-label">Needs attention</div>'+(open.length?table(open):'<div class="panel-sub">Nothing waiting on you.</div>')
      +(paid.length?'<div class="panel-label" style="margin-top:28px;">Paid</div>'+table(paid):'');
  }catch(e){box.innerHTML='<div class="flag-alert"><div class="flag-title">Error</div><div class="flag-body">'+esc(e.message)+'</div></div>';}
}

window.bTxOpen=async function(txId){
  var box=document.getElementById('btx-box');
  box.innerHTML='<p style="font-size:13px;color:#6a6a6a;">Loading…</p>';
  try{
    var j=await btx({action:'get',transaction_id:txId});
    B_CURRENT=j;
    var t=j.transaction;
    var msgsByDoc={};
    j.messages.forEach(function(m){(msgsByDoc[m.document_id]=msgsByDoc[m.document_id]||[]).push(m);});
    var html='<button class="btn-link-dark" style="margin:0 0 18px;" onclick="bTxBack()">← Review queue</button>'
      +'<div class="doc-section-header"><div><div class="doc-section-id">'+esc(TXL[t.tx_type]||t.tx_type)+' · '+esc(j.agent?j.agent.full_name:'')+'</div>'
      +'<div class="doc-section-title">'+esc(t.property_address)+'</div>'
      +'<div class="doc-section-meta">'+(t.client_name?'Client: '+esc(t.client_name)+' · ':'')+(t.side?esc(t.side)+' · ':'')+(t.closing_date?'Closing '+fmtDate(t.closing_date)+' · ':'')+(t.price?'$'+Number(t.price).toLocaleString():'')+(t.notes?'<br>Notes: '+esc(t.notes):'')+'</div></div>'
      +'<div style="text-align:right;">'+chip(STX[t.status]||t.status,toneTx(t.status))
      +(t.gross_commission!=null?'<div style="font-size:11.5px;color:#6a6a6a;margin-top:6px;">Gross on file: <strong>'+money(t.gross_commission)+'</strong></div>':'<div style="font-size:11.5px;color:#B04040;margin-top:6px;">No gross commission on file. You will enter it at Mark Paid.</div>')
      +(t.status==='paid'?'<div style="font-size:11.5px;color:#1a6b3c;margin-top:2px;">'+(PLANS[t.plan_code]||t.plan_code||'')+' · net '+money(t.net_commission)+'</div>':'')
      +'</div></div>';

    html+=j.documents.map(function(d){
      var msgs=msgsByDoc[d.id]||[];
      var row='<div class="tool-card"><div class="tool-head" style="justify-content:space-between;width:100%;">'
        +'<span class="tool-platform">'+esc(d.label)+(d.required?'':' <span style="font-size:10px;color:#8a8a8a;">(optional)</span>')+'</span>'
        +chip(SDOC[d.status]||d.status,toneDoc(d.status))+'</div>';
      if(d.file_name) row+='<div style="font-size:12px;color:#6a6a6a;margin:4px 0;">'+esc(d.file_name)+' · v'+d.version+' · uploaded '+fmtDate(d.uploaded_at)
        +' · <button class="btn-link-dark" style="margin:0;padding-top:0;" onclick="bTxDownload(\''+d.id+'\')">View</button></div>';
      if(d.status==='uploaded'){
        row+='<div style="margin:10px 0;display:flex;flex-direction:column;gap:8px;">'
          +'<textarea class="form-textarea" id="note-'+d.id+'" placeholder="Note to agent (required to reject, optional to approve)" style="min-height:52px;"></textarea>'
          +'<div><button class="btn-black-sm" onclick="bReview(\''+d.id+'\',\'approve\')">Approve</button> '
          +'<button class="btn-black-sm" style="background:#B04040;border-color:#B04040;" onclick="bReview(\''+d.id+'\',\'reject\')">Reject</button>'
          +'<span id="rvmsg-'+d.id+'" style="font-size:11px;color:#B04040;margin-left:10px;"></span></div></div>';
      }
      if(d.status==='rejected'&&d.review_note) row+='<div class="flag-alert" style="margin:10px 0;"><div class="flag-title">Your rejection note</div><div class="flag-body">'+esc(d.review_note)+'</div><div class="flag-meta">Waiting on the agent to re-upload.</div></div>';
      if(msgs.length){
        row+='<div style="border:1px solid #ece9e2;border-radius:6px;margin:10px 0;padding:12px 14px;background:#fcfcfa;">'
          +msgs.map(function(m){return '<div style="margin-bottom:8px;"><span style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:'+(m.sender_role==='broker'?'#B04040':'#1a1a1a')+';">'+esc(m.sender_name||m.sender_role)+'</span> <span style="font-size:10px;color:#a0a09a;">'+new Date(m.created_at).toLocaleString()+'</span><div style="font-size:12.5px;line-height:1.5;">'+esc(m.body)+'</div></div>';}).join('')
          +'<div style="display:flex;gap:8px;margin-top:8px;"><input class="form-input" style="margin:0;" placeholder="Reply to the agent…" id="breply-'+d.id+'"><button class="btn-black-sm" onclick="bReply(\''+d.id+'\')">Send</button></div></div>';
      }
      return row+'</div>';
    }).join('');

    if(t.status==='approved'){
      html+='<div style="margin-top:24px;padding-top:18px;border-top:1px solid #1a1a1a;">'
        +'<button class="btn-submit" onclick="bMarkPaid(\''+t.id+'\')">Mark Commission Paid</button>'
        +'<div style="font-size:11.5px;color:#8a8a8a;margin-top:8px;">All required documents are approved. This records the payout and notifies the agent. It cannot be undone.</div></div>';
    } else if(t.status==='submitted'){
      html+='<div style="margin-top:24px;font-size:12px;color:#8a8a8a;">Mark Paid unlocks automatically when every required document is approved.</div>';
    } else if(t.status==='paid'){
      html+='<div class="roadmap-note" style="margin-top:24px;">Commission marked paid '+fmtDate(t.paid_at)+'.</div>';
    }
    box.innerHTML=html;
  }catch(e){box.innerHTML='<div class="flag-alert"><div class="flag-title">Error</div><div class="flag-body">'+esc(e.message)+'</div></div>';}
};
window.bTxBack=function(){loadQueue();};
window.bTxDownload=async function(docId){
  try{var r=await btx({action:'download',document_id:docId});window.open(r.url,'_blank');}catch(e){alert(e.message);}
};
window.bReview=async function(docId,decision){
  var note=(document.getElementById('note-'+docId)||{value:''}).value.trim();
  if(decision==='reject'&&!note){document.getElementById('rvmsg-'+docId).textContent='A note is required to reject.';return;}
  if(decision==='reject'&&!confirm('Reject this document? The agent will be notified with your note and asked to re-upload.'))return;
  try{
    var r=await btx({action:'review_doc',document_id:docId,decision:decision,note:note});
    if(r.transaction_status==='approved')alert('All required documents approved. This file is now ready to pay.');
    bTxOpen(B_CURRENT.transaction.id);
  }catch(e){alert(e.message);}
};
window.bReply=async function(docId){
  var input=document.getElementById('breply-'+docId);
  if(!input.value.trim())return;
  try{await btx({action:'reply',document_id:docId,body:input.value.trim()});bTxOpen(B_CURRENT.transaction.id);}catch(e){alert(e.message);}
};
window.bMarkPaid=async function(txId){
  var cur=(B_CURRENT&&B_CURRENT.transaction&&B_CURRENT.transaction.gross_commission!=null)?B_CURRENT.transaction.gross_commission:'';
  var g=prompt('Confirm the GROSS COMMISSION for this deal.\nMust match the approved CDA. The agent’s plan split is applied automatically.',cur);
  if(g===null)return;
  g=parseFloat(String(g).replace(/[^0-9.]/g,''));
  if(!(g>0)){alert('Enter a valid gross commission amount.');return;}
  if(!confirm('Mark PAID with gross commission '+money(g)+'? This is the final step and cannot be undone.'))return;
  try{
    var r=await btx({action:'mark_paid',transaction_id:txId,gross_commission:g});
    alert('Paid. Plan '+(PLANS[r.plan_code]||r.plan_code)+' · net to agent '+money(r.net_commission)+'.');
    bTxOpen(txId);
  }catch(e){alert(e.message);}
};
async function loadTeamProduction(){
  var box=document.getElementById('bprod-box');
  box.innerHTML='<p style="font-size:13px;color:#6a6a6a;">Loading production…</p>';
  try{
    var j=await adminCall({action:'production_dashboard'});
    window.__PROD_DATA=j;
    var html='';
    html+='<div class="panel"><div class="panel-label">'+esc(j.month)+'</div><div class="panel-title">Your production.</div>'
      +'<div style="display:flex;gap:32px;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);">'
      +bStat('Lifetime Units',j.your_production.units)
      +bStat('Lifetime Volume',money(j.your_production.volume))
      +bStat('Lifetime Net',money(j.your_production.net))
      +bStat('YTD Units',j.your_production.ytd_units)
      +'</div></div>';
    html+='<div class="panel"><div class="panel-label">This Month</div><div class="panel-title">Top producers.</div>';
    if(!j.top_producers.length){
      html+='<p style="font-size:13px;color:#6a6a6a;">No paid deals yet this month.</p>';
    }else{
      html+='<div style="display:flex;flex-direction:column;">'
        +j.top_producers.map(function(a,i){
          return '<div style="display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--border-soft);">'
            +'<div style="width:28px;height:28px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;font-weight:600;flex-shrink:0;">'+(i+1)+'</div>'
            +'<div style="flex:1;"><strong style="font-size:14px;">'+esc(a.name)+'</strong></div>'
            +'<div style="font-size:13px;color:var(--text-secondary);">'+a.units+' unit'+(a.units===1?'':'s')+'</div>'
            +'<div style="font-family:var(--serif);font-size:18px;font-weight:600;min-width:110px;text-align:right;">'+money(a.volume)+'</div>'
            +'</div>';
        }).join('')+'</div>';
      if(j.one_to_watch){
        html+='<div style="margin-top:10px;font-size:12.5px;color:var(--text-secondary);">One to watch: <strong style="color:#000;">'+esc(j.one_to_watch.name)+'</strong> · '+money(j.one_to_watch.volume)+' this month.</div>';
      }
    }
    html+='</div>';
    if(j.missing_agreement_count>0){
      html+='<div class="flag-alert"><div class="flag-title">Compliance</div><div class="flag-body">'+j.missing_agreement_count+' active agent'+(j.missing_agreement_count===1?'':'s')+' with no signed ICA on file. Check Control Panel → Roster.</div></div>';
    }
    html+='<div class="panel"><div class="panel-label">Today</div><div class="panel-title">Reach out today.</div>'
      +'<div class="panel-sub">'+j.reached_count+' of '+j.active_agent_count+' active agents touched today.</div>';
    if(!j.reach_out.length){
      html+='<p style="font-size:13px;color:#6a6a6a;">No active agents on the roster.</p>';
    }else{
      html+='<div style="display:flex;flex-direction:column;">'
        +j.reach_out.map(function(a){
          return '<div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border-soft);">'
            +'<div style="flex:1;font-size:13.5px;">'+esc(a.name)+'</div>'
            +(a.reached_today?'<span style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--success-deep);font-weight:600;">Reached</span>':'<button class="btn-link-dark" style="margin:0;" onclick="bMarkReached(\''+a.user_id+'\')">Mark reached</button>')
            +'</div>';
        }).join('')+'</div>';
    }
    html+='</div>';
    html+='<div class="panel"><div class="panel-label">Roster</div><div class="panel-title">Team standings.</div>'
      +'<div class="subtabs" id="bprod-filters" style="margin-bottom:20px;">'
      +['all','closing','producing','new','quiet'].map(function(f){
        return '<button type="button" class="subtab'+(f==='all'?' active':'')+'" data-filter="'+f+'">'+(f==='all'?'All':f.charAt(0).toUpperCase()+f.slice(1))+'</button>';
      }).join('')
      +'</div><div id="bprod-standings-box"></div></div>';
    html+='<div class="panel"><div class="panel-label">'+esc(j.month)+' · Realty Side Only</div><div class="panel-title">What Aari keeps.</div>'
      +'<div class="callout">Company fee retained on paid Aari Realty transactions this month: <strong>'+money(j.aari_keeps_realty)+'</strong>. Aari Transactions TC fee revenue is a separate business and is not included here.</div></div>';
    html+='<div class="panel"><div class="panel-label">Snapshot</div><div class="panel-title">Production overview.</div>'
      +'<div style="display:flex;gap:32px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--border);">'
      +bStat('Active Agents',j.overview.active_agents)
      +bStat('Pipeline Value',money(j.overview.pipeline_value))
      +bStat('Avg Sale (YTD)',money(j.overview.avg_sale))
      +'</div></div>';
    box.innerHTML=html;
    bRenderStandings('all');
    document.querySelectorAll('#bprod-filters .subtab').forEach(function(btn){
      btn.addEventListener('click',function(){
        document.querySelectorAll('#bprod-filters .subtab').forEach(function(x){x.classList.remove('active');});
        btn.classList.add('active');
        bRenderStandings(btn.getAttribute('data-filter'));
      });
    });
  }catch(e){box.innerHTML='<div class="flag-alert"><div class="flag-title">Error</div><div class="flag-body">'+esc(e.message)+'</div></div>';}

function bStat(label,value){

async function postAnnouncement(e){
  e.preventDefault();
  var f=e.target,btn=f.querySelector('button[type=submit]');
  var urgency=f.urgency.value;
  if(urgency==='urgent'&&!confirm('Post as URGENT? Agents will be required to explicitly acknowledge this notice.'))return;
  btn.disabled=true;btn.textContent='Posting…';
  try{
    var j=await adminCall({action:'post_announcement',title:f.title.value.trim(),body:f.body.value.trim(),urgency:urgency});
    f.reset();
    alert('Posted to '+j.recipients+' active agent(s).');

  async function generateAiDraft(){
    var brief=document.getElementById('bpost-ai-brief').value.trim();
    if(!brief){alert('Describe what the post should be about first.');return;}
    var btn=document.getElementById('bpost-ai-btn');
    btn.disabled=true;var _t=btn.textContent;btn.textContent='Writing…';
    try{
      var j=await adminCall({action:'generate_post_draft',brief:brief});
      var d=j.draft;
      var f=document.getElementById('bpost-form');
      f.title.value=d.title||''; f.slug.value=d.slug||''; f.category.value=d.category||''; f.excerpt.value=d.excerpt||''; f.body_html.value=d.body_html||''; f.seo_title.value=d.seo_title||''; f.seo_description.value=d.seo_description||'';
      f.dataset.bodyIsHtml='1';
      document.getElementById('bpost-form-title').textContent='Editing: '+(d.title||'Untitled draft');
    }catch(err){alert(err.message);}
    btn.disabled=false;btn.textContent=_t;
  }
  async function previewPost(id){
    if(!id){var f=document.getElementById('bpost-form');if(!f.title.value.trim()){alert('Save the draft first, then preview.');return;}await savePostDraft({preventDefault:function(){},target:f});id=f.dataset.id;}
    var w=window.open('','_blank');
    try{
      var j=await adminCall({action:'post_preview',id:id});
      w.document.write(j.html);w.document.close();
    }catch(err){w.document.write('<p>'+esc(err.message)+'</p>');w.document.close();}
  }
  async function loadPosts(){
    var box=document.getElementById('bpost-box');
    box.innerHTML='<p style="font-size:13px;color:#6a6a6a;">Loading…</p>';
    try{
      var j=await adminCall({action:'posts_list'});
      if(!j.posts.length){box.innerHTML='<div class="panel-sub">No posts yet.</div>';return;}
      box.innerHTML=j.posts.map(function(p){
        var pub=p.status==='published';
        return '<div style="padding:14px 0;border-bottom:1px solid #ece9e2;">'
          +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">'
          +'<div><strong>'+esc(p.title)+'</strong> <span class="item-pill'+(pub?' new':'')+'" style="margin-left:8px;">'+(pub?'Published':'Draft')+'</span></div>'
          +'<div style="font-size:11px;color:#8a8a8a;">'+fmtDate(p.updated_at)+'</div>'
          +'</div>'
          +'<div style="font-size:12px;color:#8a8a8a;margin:4px 0 8px;">/blog/'+esc(p.slug)+(p.teaser_sent_at?' &middot; teaser sent':'')+'</div>'
          +'<div style="display:flex;gap:14px;font-size:11px;">'
          +'<a href="#" class="btn-link-dark" data-edit="'+p.id+'">Edit</a>'
          +'<a href="#" class="btn-link-dark" data-preview="'+p.id+'">Preview</a>'
          +(pub?('<a href="#" class="btn-link-dark" data-unpub="'+p.id+'">Unpublish</a>'):'')
          +'</div></div>';
      }).join('');
      box.querySelectorAll('[data-edit]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();editPost(a.dataset.edit);});});
      box.querySelectorAll('[data-preview]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();previewPost(a.dataset.preview);});});
      box.querySelectorAll('[data-unpub]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();if(confirm('Unpublish this post? It will no longer be visible on the blog. (Nothing is ever deleted. You can re-publish later.)'))unpublishPost(a.dataset.unpub);});});
    }catch(err){box.innerHTML='<div class="flag-alert"><div class="flag-title">Error</div><div class="flag-body">'+esc(err.message)+'</div></div>';}

  async function savePostDraft(ev){
    ev.preventDefault();
    var f=ev.target;
    var btn=document.getElementById('bpost-save-btn');
    if(btn){btn.disabled=true;btn.textContent='Saving…';}
    try{
      var j=await adminCall({action:'post_save',id:f.dataset.id||'',title:f.title.value.trim(),slug:f.slug.value.trim(),category:f.category.value.trim(),excerpt:f.excerpt.value.trim(),body_html:f.body_html.value,body_is_html:f.dataset.bodyIsHtml==='1',cover_url:f.cover_url.value.trim(),seo_title:f.seo_title.value.trim(),seo_description:f.seo_description.value.trim()});
      f.dataset.id=j.id; f.dataset.bodyIsHtml='1'; f.slug.value=j.slug;
      document.getElementById('bpost-form-title').textContent='Editing: '+f.title.value;
      loadPosts();
    }catch(err){alert(err.message);}
    if(btn){btn.disabled=false;btn.textContent='Save Draft';}
  }
  async function publishCurrentPost(){
    var f=document.getElementById('bpost-form');
    var btn=document.getElementById('bpost-publish-btn');
    if(!f.title.value.trim()||!f.body_html.value.trim()){alert('Title and body are required before publishing.');return;}
    btn.disabled=true;var _t=btn.textContent;btn.textContent='Publishing…';
    try{
      if(!f.dataset.id){
        var saved=await adminCall({action:'post_save',title:f.title.value.trim(),slug:f.slug.value.trim(),excerpt:f.excerpt.value.trim(),body_html:f.body_html.value,cover_url:f.cover_url.value.trim(),seo_title:f.seo_title.value.trim(),seo_description:f.seo_description.value.trim()});
        f.dataset.id=saved.id; f.dataset.bodyIsHtml='1'; f.slug.value=saved.slug;
      }
      var j=await adminCall({action:'post_publish',id:f.dataset.id});
      var msg='Published at /blog/'+j.slug+'.';
      if(!j.teaser_already_sent && confirm('Published. Send the teaser email to your subscribers now?')){
        try{ await adminCall({action:'post_send_teaser',id:f.dataset.id}); msg+=' Teaser email sent.'; }
        catch(e2){ msg+=' Teaser email failed: '+e2.message; }
      }
      alert(msg);
      loadPosts();
    }catch(err){alert(err.message);}
    btn.disabled=false;btn.textContent=_t;
  }
