<!--AARI_TX_MODULE-->
<script>
(function(){
var TX_LABELS={residential_sale:'Residential Sale',residential_lease:'Residential Lease',commercial_sale:'Commercial Sale',commercial_lease:'Commercial Lease'};
var STATUS_TX={draft:'Draft',submitted:'Submitted · In Review',approved:'Approved · Pending Payout',paid:'Paid'};
var STATUS_DOC={missing:'Not uploaded',uploaded:'Awaiting review',approved:'Approved',rejected:'Rejected · Action Needed'};
var ME=null, CURRENT_TX=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtDate(d){return d?new Date(d).toLocaleDateString():'—';}
function chip(text,tone){var colors={ok:'#1a6b3c',warn:'#8a6d1a',bad:'#B04040',mut:'#6a6a6a'};return '<span style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:'+(colors[tone]||'#6a6a6a')+';">'+esc(text)+'</span>';}
function money(n){return (n==null||n==='')?'—':'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});}
function tile(label,val){return '<div class="tile-card tile-light" style="cursor:default;min-height:92px;"><div class="tile-card-id">'+esc(label)+'</div><div class="tile-card-name">'+val+'</div></div>';}
function toneTx(s){return s==='paid'?'ok':s==='approved'?'ok':s==='submitted'?'warn':'mut';}
function toneDoc(s){return s==='approved'?'ok':s==='uploaded'?'warn':s==='rejected'?'bad':'mut';}

async function txApi(body){
  var s=await sb.auth.getSession(); var session=s.data.session;
  if(!session)throw new Error('Session expired. Refresh the page.');
  var r=await fetch(SB_URL+'/functions/v1/realty-tx',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SB_KEY},body:JSON.stringify(body)});
  var j=await r.json().catch(function(){return {};});
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function hubApi(body){
  var s=await sb.auth.getSession(); var session=s.data.session;
  if(!session)throw new Error('Session expired. Refresh the page.');
  var r=await fetch(SB_URL+'/functions/v1/realty-hub',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SB_KEY},body:JSON.stringify(body)});
  var j=await r.json().catch(function(){return {};});
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}

/* ---------- Announcements (agent) ---------- */
async function loadAnnouncements(){
  setPanel('tx-ann');setActiveSidebar('tx-ann');
  var box=document.getElementById('tx-ann-box');
  box.innerHTML='<p style="font-size:13px;color:#6a6a6a;">Loading…</p>';
  try{
    var j=await hubApi({action:'list_announcements'});
    updateAnnBadge(j.unread);
    if(!j.announcements.length){box.innerHTML='<div class="panel-sub">No announcements yet.</div>';return;}
    box.innerHTML=j.announcements.map(function(a){
      var urgent=a.urgency==='urgent';
      var needsAck=a.requires_ack&&!a.acknowledged;
      var unread=!a.read;
      var border=urgent?'#B04040':(unread?'#000':'#ece9e2');
      var head=(urgent?'<span style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#B04040;">⚠ Urgent</span> ':'')
        +(unread?'<span style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#000;">● New</span>':'');
      var foot='';
      if(needsAck){
        foot='<div style="margin-top:12px;"><button class="btn-black-sm" onclick="ackAnn(\''+a.id+'\')">I Acknowledge</button>'
          +'<span style="font-size:11px;color:#8a6d1a;margin-left:10px;">Acknowledgment required</span></div>';
      } else if(a.acknowledged){
        foot='<div style="margin-top:10px;font-size:11px;color:#1a6b3c;font-weight:600;">✓ Acknowledged '+(a.read_at?new Date(a.read_at).toLocaleString():'')+'</div>';
      } else if(a.read){
        foot='<div style="margin-top:10px;font-size:11px;color:#8a8a8a;">Read '+(a.read_at?new Date(a.read_at).toLocaleString():'')+'</div>';
      }
      return '<div class="tool-card" data-ann="'+a.id+'" data-read="'+(a.read?1:0)+'" data-ack="'+(a.requires_ack?1:0)+'" style="border-left:3px solid '+border+';padding-left:16px;">'
        +'<div style="margin-bottom:4px;">'+head+'</div>'
        +'<div class="tool-platform" style="font-size:19px;">'+esc(a.title)+'</div>'
        +'<div style="font-size:11px;color:#8a8a8a;margin:2px 0 8px;">'+new Date(a.posted_at).toLocaleString()+'</div>'
        +'<div style="font-size:13.5px;line-height:1.7;color:#2a2a2a;white-space:pre-wrap;">'+esc(a.body)+'</div>'
        +foot+'</div>';
    }).join('');
    // passive-read: mark normal unread ones read now that they are displayed
    j.announcements.forEach(function(a){ if(!a.read && !a.requires_ack){ hubApi({action:'read_announcement',announcement_id:a.id}).then(function(){},function(){}); }});
    if(j.announcements.some(function(a){return !a.read && !a.requires_ack;})) setTimeout(function(){updateAnnBadge(0);},400);
  }catch(e){box.innerHTML='<div class="flag-alert"><div class="flag-title">Error</div><div class="flag-body">'+esc(e.message)+'</div></div>';}
}
window.ackAnn=async function(id){
  try{await hubApi({action:'acknowledge_announcement',announcement_id:id});loadAnnouncements();refreshAnnBadge();}catch(e){alert(e.message);}
};
function updateAnnBadge(n){
  var el=document.getElementById('ann-pill');
  if(el){ if(n>0){el.textContent=n;el.style.display='';} else {el.style.display='none';} }
}
async function refreshAnnBadge(){
  try{var j=await hubApi({action:'list_announcements'});updateAnnBadge(j.unread);}catch(e){}
}

/* ---------- Training Academy (agent) ---------- */
var TRAIN_DATA=null;
function ytEmbed(url){
  var yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/);
  if(yt)return 'https://www.youtube.com/embed/'+yt[1];
  var vm=url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(vm)return 'https://player.vimeo.com/video/'+vm[1];
  var lm=url.match(/loom\.com\/share\/([A-Za-z0-9]+)/);
  if(lm)return 'https://www.loom.com/embed/'+lm[1];
  return null;
}
async function loadTraining(){
  setPanel('tx-train');setActiveSidebar('tx-train');
  var box=document.getElementById('tx-train-box');
  box.innerHTML='<p style="font-size:13px;color:#6a6a6a;">Loading…</p>';
  try{
    var j=await hubApi({action:'list_training'});
    TRAIN_DATA=j;
    if(!j.categories.length){box.innerHTML='<div class="panel-sub">No training content yet.</div>';return;}
    var pct=j.required_total?Math.round(100*j.required_done/j.required_total):100;
    var head='<div class="roadmap-note" style="border-left-color:'+(j.current?'#1a6b3c':'#8a6d1a')+';">'
      +(j.current?'<strong>You’re current.</strong> All required training complete. ':'<strong>'+j.required_done+' of '+j.required_total+' required items complete</strong> ('+pct+'%). ')
      +j.completed+' of '+j.total+' total items done.</div>';
    var byCat={};j.items.forEach(function(it){(byCat[it.category_id]=byCat[it.category_id]||[]).push(it);});
    var body=j.categories.map(function(c){
      var items=(byCat[c.id]||[]);
      if(!items.length)return '';
      var done=items.filter(function(i){return i.completed;}).length;
      return '<div class="panel"><div class="panel-label">'+esc(c.name)+' · '+done+'/'+items.length+'</div>'
        +(c.description?'<div class="panel-sub">'+esc(c.description)+'</div>':'')
        +items.map(function(it){
          var typeLabel=it.content_type==='video_link'?'Video':it.content_type==='document'?'Document':'Reading';
          return '<div class="tool-card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">'
            +'<div><div class="tool-platform" style="font-size:16px;">'+esc(it.title)+(it.required?'':' <span style="font-size:10px;color:#8a8a8a;">(optional)</span>')+'</div>'
            +'<div style="font-size:11px;color:#8a8a8a;letter-spacing:1px;text-transform:uppercase;">'+typeLabel+'</div></div>'
            +'<div style="display:flex;align-items:center;gap:12px;white-space:nowrap;">'
            +(it.completed?'<span style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#1a6b3c;">✓ Done</span>':'')
            +'<button class="btn-link-dark" style="margin:0;" onclick="trainOpen(\''+it.id+'\')">Open</button></div></div>';
        }).join('')+'</div>';
    }).join('');
    box.innerHTML=head+body;
  }catch(e){box.innerHTML='<div class="flag-alert"><div class="flag-title">Error</div><div class="flag-body">'+esc(e.message)+'</div></div>';}
}
window.trainOpen=async function(itemId){
  var it=TRAIN_DATA.items.find(function(x){return x.id===itemId;});
  if(!it)return;
  var box=document.getElementById('tx-train-box');
  var media='';
  if(it.content_type==='video_link'&&it.content){
    var emb=ytEmbed(it.content);
    media=emb
      ? '<div style="position:relative;padding-bottom:56.25%;height:0;margin:16px 0;border:1px solid #ece9e2;border-radius:6px;overflow:hidden;"><iframe src="'+esc(emb)+'" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>'
      : '<div style="margin:16px 0;"><a class="btn-black-sm" href="'+esc(it.content)+'" target="_blank" rel="noopener">Open video ↗</a></div>';
  } else if(it.content_type==='document'){
    media='<div style="margin:16px 0;"><button class="btn-black-sm" onclick="trainDownload(\''+it.id+'\')">View document'+(it.file_name?' · '+esc(it.file_name):'')+'</button></div>';
  } else if(it.content_type==='text'&&it.content){
    media='<div style="font-size:13.5px;line-height:1.75;color:#2a2a2a;white-space:pre-wrap;margin:16px 0;">'+esc(it.content)+'</div>';
  }
  box.innerHTML='<button class="btn-link-dark" style="margin:0 0 18px;" onclick="loadTraining()">← All training</button>'
    +'<div class="content-title" style="font-size:28px;">'+esc(it.title)+'</div>'
    +(it.description?'<div class="content-sub" style="margin:6px 0 0;">'+esc(it.description)+'</div>':'')
    +media
    +'<div style="margin-top:24px;padding-top:18px;border-top:1px solid #1a1a1a;">'
    +(it.completed
      ? '<span style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#1a6b3c;">✓ Completed '+(it.completed_at?new Date(it.completed_at).toLocaleDateString():'')+'</span> <button class="btn-link-dark" style="margin-left:14px;" onclick="trainMark(\''+it.id+'\',false)">Mark not done</button>'
      : '<button class="btn-submit" onclick="trainMark(\''+it.id+'\',true)">Mark Complete</button>')
    +'</div>';
};
window.trainDownload=async function(itemId){
  try{var r=await hubApi({action:'training_download',item_id:itemId});window.open(r.url,'_blank');}catch(e){alert(e.message);}
};
window.trainMark=async function(itemId,done){
  try{
    await hubApi({action:done?'mark_complete':'unmark_complete',item_id:itemId});
    var j=await hubApi({action:'list_training'});TRAIN_DATA=j;
    trainOpen(itemId);
  }catch(e){alert(e.message);}
};

window.goTo=goTo;

/* ---------- Broker / Agent view toggle (broker accounts only) ----------
   Brokers who also work deals as producing agents can flip between the
   full Broker Only tooling (roster, review queue, team production, etc.)
   and a plain Agent view of their own numbers. This never changes backend
   permissions — it only hides the "Broker Only" sidebar group client-side
   and asks Home for the agent-shaped payload instead of the broker one. */
var VIEW_KEY='aari-view-mode-v2';
function getViewMode(){ return (ME&&ME.role==='broker') ? (localStorage.getItem(VIEW_KEY)||'broker') : 'agent'; }
function viewToggleStyle(){
  // Marlenyi Jul 28 · Option B · color-dot pill row (Money sage, TC amber,
  // Broker navy, Agent plum). Same CSS covers the four hr-pill children.
  if(document.getElementById('vt-css'))return;
  var s=document.createElement('style');s.id='vt-css';
  s.textContent='#hub-role-row{display:flex;align-items:center;gap:4px;margin-right:10px;padding:2px;}'
   +'.hr-pill{background:none;border:0;cursor:pointer;font-family:inherit;padding:7px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font:700 10px "Montserrat",sans-serif;text-transform:uppercase;letter-spacing:1.5px;color:#6a6a6a;transition:all .12s;text-decoration:none;line-height:1;}'
   +'.hr-pill:hover{background:#f4f1e8;color:#1a1a1a;}'
   +'.hr-pill.on{background:#1a1a1a;color:#fff;}'
   +'.hr-dot{width:8px;height:8px;border-radius:50%;flex:none;}'
   +'.hr-pill[data-role=money] .hr-dot{background:#c8e0c4;}'
   +'.hr-pill[data-role=tc] .hr-dot{background:#f5d9b0;}'
   +'.hr-pill[data-role=broker] .hr-dot{background:#c9dcef;}'
   +'.hr-pill[data-role=agent] .hr-dot{background:#e2c9dc;}'
   +'.hr-pill.on .hr-dot{background:#fff !important;box-shadow:inset 0 0 0 1.5px #1a1a1a;}';
  document.head.appendChild(s);
}
function applyViewMode(){
  if(!ME)return;/*run for agents too so broker-only leaves get hidden*/
  var mode=(ME.role==='broker')?getViewMode():'agent';
  var HIDE_GROUP_IN_AGENT = {'broker only':1};
  document.querySelectorAll('.sidebar-group').forEach(function(g){
    var lbl=g.querySelector('.sidebar-group-label'); if(!lbl) return;
    var t = lbl.textContent.trim().toLowerCase();
    // tx_module "Broker" group (Announcements + Training Academy) is distinguishable from the hardcoded "Broker"/"Hub" group by having a Training Academy item.
    var isBrokerOnlyGroup = (t==='broker' && g.querySelector('[data-panel="tx-train"]')) || HIDE_GROUP_IN_AGENT[t];
    if(isBrokerOnlyGroup) g.style.display = (mode==='agent') ? 'none' : '';
  });
  // Item-level: hide Team Production in agent view (keep the rest of Transactions group visible)
  var teamNav = document.getElementById('tc-team-nav');
  if(teamNav) teamNav.style.display = (mode==='agent') ? 'none' : '';
    document.querySelectorAll('.sidebar-item[data-panel="onboarding"],.sidebar-item[data-panel="financial-hub"],.sidebar-item[data-panel="tc-portal"],.sidebar-item[data-panel="tx-guide"]').forEach(function(el){ el.style.display = (mode==='agent') ? 'none' : ''; });
  document.querySelectorAll('.hr-pill[data-mode]').forEach(function(b){ b.classList.toggle('on', b.dataset.mode===mode); });
  // Legacy .vt-btn selector kept working: since Broker/Agent pills now carry
  // BOTH .hr-pill and .vt-btn classes, the .vt-active toggle below is
  // harmless but preserves any external code that reads the old marker.
  document.querySelectorAll('.vt-btn').forEach(function(b){ b.classList.toggle('vt-active', b.dataset.mode===mode); });
  if(typeof tcApplyTeamNavVis==='function')tcApplyTeamNavVis();
  if(mode==='agent'){
    var active=document.querySelector('.sidebar-item.active');
    if(active && /^broker-/.test(active.dataset.panel||'')) goTo('home');
  }
}
window.setViewMode=function(mode){
  if(mode!=='broker'&&mode!=='agent')return;
  localStorage.setItem(VIEW_KEY,mode);
  applyViewMode();
  goTo('home');
  if(typeof window.aariReloadHome==='function') window.aariReloadHome();
};
function watchBrokerGroup(){
  var sidebar=document.getElementById('sidebar'); if(!sidebar)return;
  var mo=new MutationObserver(function(){ applyViewMode(); });
  mo.observe(sidebar,{childList:true});
}

/* ---------- notifications bell ---------- */
async function pollNtf(){
  try{
    var s=await sb.auth.getSession(); if(!s.data.session)return;
    var q=await sb.from('realty_notifications').select('id',{count:'exact',head:true}).is('read_at',null);
    var n=q.count||0;
    var el=document.getElementById('ntf-count');
    if(el){var dot=document.getElementById('ntf-dot');if(dot)dot.style.display=n>0?'block':'none';el.setAttribute('aria-label',n>0?('Alerts, '+n+' unread'):'Alerts');}
  }catch(e){}
}
async function openNtf(){
  var panel=document.getElementById('ntf-panel');
  if(panel.style.display==='block'){panel.style.display='none';return;}
  panel.style.display='block';
  panel.innerHTML='<div style="padding:14px;font-size:12px;color:#6a6a6a;">Loading…</div>';
  try{
    var q=await sb.from('realty_notifications').select('*').order('created_at',{ascending:false}).limit(30);
    var rows=(q.data||[]).map(function(n){
      return '<div style="padding:12px 16px;border-bottom:1px solid #f0ede5;'+(n.read_at?'opacity:.55;':'')+'">'
        +'<div style="font-size:12.5px;line-height:1.5;color:#1a1a1a;">'+esc(n.body)+'</div>'
        +'<div style="font-size:10.5px;color:#8a8a8a;margin-top:3px;">'+new Date(n.created_at).toLocaleString()+'</div></div>';
    }).join('');
    panel.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #1a1a1a;"><strong style="font-size:11px;letter-spacing:2px;text-transform:uppercase;">Notifications</strong><button class="btn-link-dark" style="margin:0;" id="ntf-markall">Mark all read</button></div>'+(rows||'<div style="padding:16px;font-size:12.5px;color:#8a8a8a;">Nothing yet.</div>');
    document.getElementById('ntf-markall').addEventListener('click',async function(){
      await sb.from('realty_notifications').update({read_at:new Date().toISOString()}).is('read_at',null);
      panel.style.display='none';pollNtf();
    });
  }catch(e){panel.innerHTML='<div style="padding:14px;font-size:12px;color:#B04040;">'+esc(e.message)+'</div>';}
}

/* ---------- views ---------- */
function setActiveSidebar(panelName){
  document.querySelectorAll('.sidebar-item').forEach(function(s){s.classList.toggle('active',s.dataset.panel===panelName);});
}
async function viewList(){
  setPanel('tx-list');setActiveSidebar('tx-list');
  var box=document.getElementById('tx-list-box');
  box.innerHTML='<p style="font-size:13px;color:#6a6a6a;">Loading…</p>';
  try{
    var j=await txApi({action:'list_mine'});
    if(!j.transactions.length){box.innerHTML='<div class="panel-sub">No transactions yet. Start one under <strong>New Transaction</strong>.</div>';return;}
    box.innerHTML='<table class="history-table"><thead><tr><th>Property</th><th>Type</th><th>Status</th><th>Docs Approved</th><th>Submitted</th><th></th></tr></thead><tbody>'+
      j.transactions.map(function(t){
        return '<tr><td><strong>'+esc(t.property_address)+'</strong></td><td>'+esc(TX_LABELS[t.tx_type]||t.tx_type)+'</td>'
        +'<td>'+chip(STATUS_TX[t.status]||t.status,toneTx(t.status))+(t.doc_rejected>0?'<br>'+chip(t.doc_rejected+' rejected · fix now','bad'):'')+'</td>'
        +'<td>'+t.doc_approved+' / '+t.doc_total+'</td><td>'+fmtDate(t.submitted_at)+'</td>'
        +'<td><button class="btn-link-dark" style="margin:0;" onclick="txOpen(\''+t.id+'\')">Open</button></td></tr>';
      }).join('')+'</tbody></table>';
  }catch(e){box.innerHTML='<div class="flag-alert"><div class="flag-title">Error</div><div class="flag-body">'+esc(e.message)+'</div></div>';}
}

window.txOpen=async function(txId){
  setPanel('tx-list');setActiveSidebar('tx-list');
  var box=document.getElementById('tx-list-box');
  box.innerHTML='<p style="font-size:13px;color:#6a6a6a;">Loading transaction…</p>';
  try{
    var j=await txApi({action:'get',transaction_id:txId});
    CURRENT_TX=j;
    var t=j.transaction;
    var msgsByDoc={};
    j.messages.forEach(function(m){(msgsByDoc[m.document_id]=msgsByDoc[m.document_id]||[]).push(m);});
    var locked=t.status!=='draft';
    var html='<button class="btn-link-dark" style="margin:0 0 18px;" onclick="txBack()">← All transactions</button>'
      +'<div class="doc-section-header"><div><div class="doc-section-id">'+esc(TX_LABELS[t.tx_type]||t.tx_type)+'</div>'
      +'<div class="doc-section-title">'+esc(t.property_address)+'</div>'
      +'<div class="doc-section-meta">'+(t.client_name?'Client: '+esc(t.client_name)+' · ':'')+(t.side?esc(t.side)+' · ':'')+(t.closing_date?'Closing '+fmtDate(t.closing_date)+' · ':'')+(t.price?'$'+Number(t.price).toLocaleString():'')+'</div></div>'
      +'<div style="text-align:right;">'+chip(STATUS_TX[t.status]||t.status,toneTx(t.status))
      +(t.paid_at?'<div style="font-size:11px;color:#8a8a8a;margin-top:4px;">Paid '+fmtDate(t.paid_at)+'</div>':'')+'</div></div>';
    if(locked && t.status==='submitted') html+='<div class="roadmap-note">This file is <strong>locked for broker review</strong>. You can only replace documents the broker rejects.</div>';
    if(t.status==='approved') html+='<div class="roadmap-note">All documents approved. <strong>Commission is being processed.</strong></div>';
    if(t.status==='draft'){
      html+='<div style="display:flex;gap:10px;align-items:flex-end;margin:0 0 18px;max-width:420px;"><div style="flex:1;"><label class="form-label">Gross Commission ($)</label><input class="form-input" id="gross-input" type="number" step="0.01" value="'+(t.gross_commission!=null?t.gross_commission:'')+'"></div><button class="btn-black-sm" onclick="txSetGross(\''+t.id+'\')">Save</button></div>';
    } else if(t.status==='paid'){

function tcChip(label,tone){return '<span class="tcport-chip '+(tone||'mut')+'">'+esc(label)+'</span>';}
function tcDeadlineChip(f){
 var eng=window.AariDeadlineEngine;
 if(!eng||!f.contract_type||!f.effective_date)return tcChip('No deadlines set','mut');
 var dl;try{dl=eng.fileDeadlines(f);}catch(e){return tcChip('No deadlines set','mut');}
 var rows=Object.keys(dl).map(function(k){return dl[k];}).filter(function(r){return r&&r.date;});
 if(!rows.length)return tcChip('No deadlines set','mut');
 rows.sort(function(a,b){return a.date-b.date;});
 var upcoming=rows.filter(function(r){return eng.dlState(r.date)!=='overdue';});
 var next=upcoming.length?upcoming[0]:rows[rows.length-1];
 var st=eng.dlState(next.date);
 var tone=st==='overdue'?'bad':st==='today'?'warn':'mut';
 return tcChip(next.label+' · '+eng.fmtDl(next.date),tone);
}
function tcTaskDone(f){var st=f.stage_tasks||{};var n=0;Object.keys(st).forEach(function(k){if(st[k]&&st[k].done)n++;});return n;}
function tcKanbanBucket(f){
 if(f.transaction_stage==='under_contract'||f.transaction_stage==='active'){
  if(f.closing_date){var d=new Date(f.closing_date+'T12:00:00');var days=Math.round((d-new Date())/86400000);if(days<=14)return 'final';}
  return 'progress';
 }
 return 'start';
}
function tcOverdueFile(files){
 var eng=window.AariDeadlineEngine; if(!eng)return null;
 var worst=null,worstDate=null;
 files.forEach(function(f){
  if(!f.contract_type||!f.effective_date)return;
  var dl; try{dl=eng.fileDeadlines(f);}catch(e){return;}
  Object.keys(dl).forEach(function(k){
   var r=dl[k]; if(!r||!r.date)return;
   if(eng.dlState(r.date)==='overdue'){
    if(!worstDate||r.date<worstDate){worstDate=r.date;worst={file:f,label:r.label,date:r.date};}
   }
  });
 });
 return worst;
}
function tcKanbanCard(f){
 var svc=(f.service_type||'').replace(/_/g,' ');
 var done=tcTaskDone(f);
 return '<div class="tcport-kcard"><div class="tcport-kcard-top"><div class="tcport-addr" style="font-size:14px;">'+esc(f.property_address||'—')+'</div>'
 +(svc?'<div class="tcport-kcard-pill">'+esc(svc)+'</div>':'')+'</div>'
 +'<div class="tcport-kcard-sub">'+tcDeadlineChip(f)+(done?' · '+done+' task'+(done===1?'':'s')+' logged':'')+'</div></div>';
}

function tcAariCut(f,pay){
 if(!pay)return 0;
 try{
  var fee=(typeof pay.chargedPrice==='function')?pay.chargedPrice(f,{}):((f.service_price_cents||0)/100);
  var tcPay=0;
  if(typeof pay.isTcService==='function'&&pay.isTcService(f)&&typeof pay.tcPayCeiling==='function'){
   tcPay=pay.tcPayCeiling(f,null,null);
  }else if(typeof pay.isFileOrgFile==='function'&&pay.isFileOrgFile(f)&&typeof pay.paysFileOrg==='function'&&pay.paysFileOrg(f)){
   tcPay=80;
  }
  var cut=fee-tcPay; return cut>0?cut:0;
 }catch(e){return 0;}
}
function tcBucketAgent(agentFiles){
 var now=new Date();
 var hasActive=agentFiles.some(function(f){return f.transaction_stage&&f.transaction_stage!=='closed';});
 var closingSoon=agentFiles.some(function(f){
  if(!f.closing_date||f.transaction_stage==='closed')return false;
  var d=new Date(f.closing_date+'T12:00:00');var days=Math.round((d-now)/86400000);
  return days>=0&&days<=14;
 });
 if(closingSoon)return 'closing';
 if(hasActive)return 'producing';
 if(agentFiles.length)return 'quiet';
 return 'new';
}

/* ---------- onboarding checklist · server sync (Plan 1) ----------
   Writes every Start Here checklist change to realty_members.onboarding_checklist
   via realty-hub (service role). The base portal keeps writing localStorage on
   change as the offline fallback; this layer makes the DB authoritative and gives
   the broker real onboarding visibility. One-time migration of any pre-existing
   localStorage progress to the server on first hydrate. */
var OB_KEY='aari-onboarding-checklist-v1';
var obTimer=null, obMigrated=false;
function obCollect(){var d={};document.querySelectorAll('input[type=checkbox][data-check]').forEach(function(cb){if(cb.checked)d[cb.dataset.check]=true;});return d;}
function obApplyMap(map){
  document.querySelectorAll('input[type=checkbox][data-check]').forEach(function(cb){cb.checked=!!(map&&map[cb.dataset.check]);});
  try{localStorage.setItem(OB_KEY,JSON.stringify(map||{}));}catch(e){}
  if(typeof window.updateChecklistProgress==='function'){try{window.updateChecklistProgress();}catch(e){}}
}
async function obServerSave(){ try{await hubApi({action:'save_onboarding',checklist:obCollect()});}catch(e){/* offline: localStorage fallback already holds it */} }
function obQueueSave(){ if(obTimer)clearTimeout(obTimer); obTimer=setTimeout(obServerSave,600); }
async function obHydrate(){
  if(!document.querySelector('input[type=checkbox][data-check]'))return;
  try{
    var r=await hubApi({action:'get_onboarding'});
    var server=(r&&r.checklist)?r.checklist:{};
    if(Object.keys(server).length===0 && !obMigrated){
      var local={};try{local=JSON.parse(localStorage.getItem(OB_KEY)||'{}');}catch(e){}
      if(Object.keys(local).length>0){ obMigrated=true; obApplyMap(local); await obServerSave(); return; }
    }
    obMigrated=true;
    obApplyMap(server);
  }catch(e){/* offline: leave base-portal localStorage state as-is */}
}
function obInit(){
  document.addEventListener('change',function(e){ if(e.target&&e.target.matches&&e.target.matches('input[type=checkbox][data-check]')) obQueueSave(); });
  var sh=document.querySelector('.sidebar-item[data-panel="start-here"]');
  if(sh)sh.addEventListener('click',function(){ setTimeout(obHydrate,60); });
  if(typeof window.resetChecklist==='function' && !window.__obResetWrap){
    window.__obResetWrap=true; var _r=window.resetChecklist;
    window.resetChecklist=function(){ var out=_r.apply(this,arguments); setTimeout(obServerSave,20); return out; };
  }
  obHydrate();
}

var CTR_FIELDS = [
  ['contract_type','Type','Tipo'],
  ['__property','Property','Propiedad'],

];

function ctrT(k){ return (CTR_T[CTR_LANG]||CTR_T.en)[k]; }

function ctrEx(row){
  var raw = row && row.raw_form_data;
  return (raw && raw.extracted_contract) || null;
}
function ctrContractPath(row){
  var raw = (row && row.raw_form_data) || {};
  return raw.contract_path || raw.contract_file || raw.contract_url || raw.executed_contract_path || null;
}
function ctrLabel(row){
  var ex = ctrEx(row), f = (ex && ex.fields) || {};
  if(f.address) return f.address;
  if(f.street) return f.street + (f.city ? ', ' + f.city : '');
  var p = ctrContractPath(row);
  if(p) return String(p).split('/').pop().replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').slice(0,60);
  return 'File ' + String(row.id).slice(0,8);
}
function ctrMoney(v){
  if(v == null || String(v).trim() === '') return null;
  var digits = String(v).replace(/[^0-9.]/g,'');
  // No digits at all is a written value like TBD. Worth showing as written,
  // because that is what the contract says.
  if(!digits) return String(v);
  var n = Number(digits);
  // Zero is absent, the same rule flags.js applies. A contract with a zero
  // deposit has no deposit, and rendering 0.00 reads as a confirmed figure
  // rather than a blank.
  if(!isFinite(n) || n <= 0) return null;
  return '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
/* Mirrored from moneyUnconfirmed in flags.js, which cannot be imported into a
   browser. build/test-contracts.js runs both against the same table of cases
   and fails if they ever disagree, so this cannot drift quietly.

   The extractor reads a purchase price off anything whose head looks enough
   like a contract. A listing agreement classified Standard Residential
   produced a price of $399 and this screen showed it as confidently as a real
   one. Twelve files carry no contract_type at all and six of those produced a
   price anyway. */
function ctrMoneyUnconfirmed(f){
  f = f || {};
  var ct = f.contract_type;
  if(ct == null || String(ct).trim() === '') return true;
  var digits = String(f.price == null ? '' : f.price).replace(/[^0-9.]/g,'');
  var n = digits ? Number(digits) : null;
  if(/residential/i.test(String(ct)) && n !== null && isFinite(n) && n > 0 && n < 10000) return true;
  return false;
}

function ctrVal(f, key){
  if(key === '__property'){
    if(f.address) return f.address;
    var bits = [f.street, f.city, f.state, f.zip].filter(Boolean);
    return bits.length ? bits.join(', ') : null;
  }
  if(key === 'price' || key === 'emd') return ctrMoney(f[key]);
  if(key === 'financing_type' && f[key]) return String(f[key]).toUpperCase();
  var v = f[key];
  return (v == null || String(v).trim() === '') ? null : String(v);
}

async function ctrLoadRail(){
  var rail = document.getElementById('ctr-rail');

  try{
    var r = await sb.from('files').select('id, client_type, created_at, raw_form_data').order('created_at',{ascending:false});
    if(r.error) throw new Error(r.error.message);
    // Every file that has a contract on it, extracted or not. A file that
    // failed to parse is the one a coordinator most needs to see, so it stays
    // in the list and says so rather than being filtered out of view.
    CTR_ROWS = (r.data||[]).filter(function(x){ return !!ctrContractPath(x); });
    var withEx = CTR_ROWS.filter(function(x){ return !!ctrEx(x); }).length;
    var total = (r.data||[]).length;
    var head = '<div class="ctr-count">' + withEx + ' of ' + CTR_ROWS.length +
      ' contracts extracted' + (total > CTR_ROWS.length ? ' &middot; ' + (total - CTR_ROWS.length) + ' files have no contract on them at all' : '') + '</div>';
    if(!CTR_ROWS.length){ rail.innerHTML = head + '<div class="ctr-note">No files carry a contract yet.</div>'; return; }
    rail.innerHTML = head + CTR_ROWS.map(function(x,i){
      var has = !!ctrEx(x);
      var d = x.created_at ? new Date(x.created_at).toLocaleDateString() : '';
      // No delete control, deliberately. These are transaction records for a
      // Florida brokerage and there is no business reason to remove one from
      // a dashboard.
      return '<button class="ctr-row" type="button" data-ctr="'+i+'">'
        + '<span class="ctr-mark '+(has?'on':'off')+'" aria-hidden="true"></span>'
        + '<span class="ctr-rowtx"><span class="ctr-rowname">'+esc(ctrLabel(x))+'</span>'
        + '<span class="ctr-rowmeta">'+esc(d)+' &middot; '+(has?ctrT('extracted'):ctrT('notrun'))+'</span></span></button>';
    }).join('');
    rail.querySelectorAll('[data-ctr]').forEach(function(b){
      b.addEventListener('click', function(){ ctrOpen(parseInt(b.getAttribute('data-ctr'),10)); });
    });
  }catch(e){
    rail.innerHTML = '<div class="ctr-note err">Could not load files: '+esc(e.message)+'</div>';
  }
}

function ctrRenderPanel(){

         : 'This file has a contract on it but has never been through the extractor, so nothing is known about its terms. That is not the same as nothing being wrong.')
      + '</div></div>';

  }

  // A figure read off a document we cannot name, or one that cannot be what it
  // says it is, still shows. Suppressing it would hide what the extractor
  // actually read. It is marked instead, so nobody works from it by accident.
  var moneyDoubt = ctrMoneyUnconfirmed(f);

    return '<div class="ctr-fld"><span class="ctr-k">'+esc(CTR_LANG==='es'?t[2]:t[1])+'</span>'
      + '<span class="ctr-v'+(v?'':' none')+'">'+esc(v || ctrT('none'))
      + (doubt ? ' <span class="ctr-unc">'+esc(ctrT('unconfirmed'))+'</span>' : '')
      + '</span></div>';
  }).join('');
  var partyRows = CTR_PARTIES.map(function(t){
    var v = ctrVal(f, t[0]);
    return '<div class="ctr-fld"><span class="ctr-k">'+esc(CTR_LANG==='es'?t[2]:t[1])+'</span>'
      + '<span class="ctr-v'+(v?'':' none')+'">'+esc(v || ctrT('none'))+'</span></div>';
  }).join('');

  // stop above check, the same order the broker flags panel already uses.
  var sorted = flags.slice().sort(function(a,b){
    if(a.severity === b.severity) return 0;
    return a.severity === 'stop' ? -1 : 1;
  });
  /* Zero flags means one of two completely different things and they must not
     read alike. flags_at is written by the flag pass, so its absence means
     nothing was ever evaluated on this file. Saying "no flags" there would be
     the same mistake as listing field flags under a contract nobody can read:
     silence dressed up as an all clear. */
  var everRun = !!(ex.flags_at);
  var flagHtml = sorted.length
    ? sorted.map(function(x){ return ctrFlagCard(x, docs); }).join('')
    : (everRun
        ? '<div class="ctr-note">'+ctrT('noflags')+'</div>'
        : '<div class="ctr-empty"><b>'+ctrT('notrun_flags')+'</b><div>'+ctrT('notrun_flags_sub')+'</div></div>');

  // The packet split, with real start pages. This is the page navigation that
  // can be honest, because these documents exist and their pages are recorded.
  var docHtml = docs.length ? '<div class="ctr-sec">'+ctrT('docs')+'</div><div class="ctr-docs">'
    + docs.map(function(d){
        return '<button class="ctr-doc" type="button" data-ctrpage="'+Number(d.page||1)+'">'
          + esc(d.title||'Document') + ' <span>p'+Number(d.page||1)+'</span></button>';
      }).join('') + '</div>' : '';

  p.innerHTML = lang
    + '<div class="ctr-sec">'+ctrT('details')+'</div>' + fieldRows
    + '<div class="ctr-sec">'+ctrT('parties')+'</div>' + partyRows
    + docHtml
    + '<div class="ctr-sec">'+ctrT('flags')+'</div>' + flagHtml;
  ctrWirePanel();
}

function ctrWirePanel(){
  document.querySelectorAll('[data-ctrlang]').forEach(function(b){
    b.addEventListener('click', function(){ CTR_LANG = b.getAttribute('data-ctrlang'); ctrRenderPanel(); ctrPaintChrome(); });
  });
  document.querySelectorAll('[data-ctrpage]').forEach(function(b){
    b.addEventListener('click', function(){ CTR_PAGE = parseInt(b.getAttribute('data-ctrpage'),10)||1; ctrPaint(); });
  });
}

/* pdf.js is loaded the first time this screen is opened, not on every Hub
   load. It is 320KB and most people never come here. */
var __ctrPdfReady = null;
function ctrPdf(){
  if(__ctrPdfReady) return __ctrPdfReady;
  __ctrPdfReady = new Promise(function(res, rej){
    if(window.pdfjsLib){ res(window.pdfjsLib); return; }
    var s = document.createElement('script');
    s.src = CTR_PDFJS;
    s.onload = function(){
      if(!window.pdfjsLib){ rej(new Error('pdf.js loaded but did not register')); return; }
      // Without this pdf.js silently parses on the main thread, which looks
      // fine until a twenty page contract locks the tab.
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = CTR_PDFJS_WORKER;
      res(window.pdfjsLib);
    };
    s.onerror = function(){ rej(new Error('could not load ' + CTR_PDFJS)); };
    document.head.appendChild(s);
  });
  return __ctrPdfReady;
}

async function ctrRenderDoc(){
  var host = document.getElementById('ctr-doc');
  if(CTR_SEL == null){ host.innerHTML = ''; return; }
  var row = CTR_ROWS[CTR_SEL];
  var path = ctrContractPath(row);
  host.innerHTML = '<div class="ctr-note">Opening the contract…</div>';
  try{
    var key = String(path).replace(/^.*\/transaction-files\//,'').replace(/^\/+/,'');
    var signed = await sb.storage.from('transaction-files').createSignedUrl(key, 600);
    if(signed.error || !signed.data) throw new Error((signed.error && signed.error.message) || 'could not sign the file');
    var lib = await ctrPdf();
    CTR_DOC = await lib.getDocument({ url: signed.data.signedUrl }).promise;
    host.innerHTML = '<div class="ctr-chrome">'
      + '<button type="button" class="ctr-nav" id="ctr-prev">&lsaquo;</button>'
      + '<span id="ctr-pos" class="ctr-pos"></span>'
      + '<button type="button" class="ctr-nav" id="ctr-next">&rsaquo;</button>'
      + '<span class="ctr-gap"></span>'
      + '<button type="button" class="ctr-nav" id="ctr-out">&minus;</button>'
      + '<span id="ctr-zoom" class="ctr-pos"></span>'
      + '<button type="button" class="ctr-nav" id="ctr-in">+</button></div>'
      + '<div class="ctr-canvaswrap"><canvas id="ctr-canvas"></canvas></div>';
    document.getElementById('ctr-prev').addEventListener('click', function(){ if(CTR_PAGE>1){CTR_PAGE--; ctrPaint();} });
    document.getElementById('ctr-next').addEventListener('click', function(){ if(CTR_DOC && CTR_PAGE<CTR_DOC.numPages){CTR_PAGE++; ctrPaint();} });
    document.getElementById('ctr-out').addEventListener('click', function(){ CTR_ZOOM=Math.max(0.5,CTR_ZOOM-0.25); ctrPaint(); });
    document.getElementById('ctr-in').addEventListener('click', function(){ CTR_ZOOM=Math.min(3,CTR_ZOOM+0.25); ctrPaint(); });
    ctrPaint();
  }catch(e){
    host.innerHTML = '<div class="ctr-note err">Could not open the contract: '+esc(e.message)+'</div>';
  }
}

function ctrPaintChrome(){
  var pos = document.getElementById('ctr-pos');
  if(pos && CTR_DOC) pos.textContent = ctrT('page')+' '+CTR_PAGE+' '+ctrT('of')+' '+CTR_DOC.numPages;
  var z = document.getElementById('ctr-zoom');
  if(z) z.textContent = Math.round(CTR_ZOOM*100) + '%';
}

async function ctrPaint(){
  if(!CTR_DOC) return;
  if(CTR_PAGE > CTR_DOC.numPages) CTR_PAGE = CTR_DOC.numPages;
  if(CTR_PAGE < 1) CTR_PAGE = 1;
  ctrPaintChrome();
  try{
    var page = await CTR_DOC.getPage(CTR_PAGE);
    var vp = page.getViewport({ scale: CTR_ZOOM });
    var canvas = document.getElementById('ctr-canvas');
    if(!canvas) return;
    var ctx = canvas.getContext('2d');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
  }catch(e){ console.error('contract render', e); }
}

function loadContracts(){
  if(!ctrCanSee()) return;
  ctrCss();
  var box = document.getElementById('ctr-box');
  if(!box) return;
  if(!box.getAttribute('data-built')){
    box.setAttribute('data-built','1');
    box.innerHTML = '<div id="ctr-wrap"><div id="ctr-rail"></div><div id="ctr-doc"></div><div id="ctr-panel"></div></div>';
  }
  ctrRenderPanel();
  ctrLoadRail();
}
